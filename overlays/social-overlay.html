<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socials Overlay - Social Stream Ninja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        type="text/css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        type="text/css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style type="text/css">
        @charset 'UTF-8';

        *,
        *:after,
        *:before {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        * {
            outline: 0;
            border: none;
            font-family: inherit;
            font-size: 100%;
            background: transparent;
            vertical-align: baseline;
        }

        :root {
            --base-width: 48rem;
            --brand-size: 5rem;

            --social-letter-spacing: 4px;
            --social-font-family: 'Noto Sans';
            --social-font-weight: 700;
            --social-font-size: 4rem;
            --social-text-color: #cbd5e1;

            --brand-discord: #5865f2;
            --brand-facebook: #005fed;
            --brand-kick: #00e701;
            --brand-tiktok: #2af0ea;
            --brand-x: #000000;
            --brand-twitch: #6441a5;
            --brand-youtube: #f80231;
            --brand-youtubeshorts: #f80231;
            --brand-instagram: #e4405f;
        }

        body {
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        #social-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        .social-list {
            width: var(--base-width);
            flex: 0 0 var(--base-width);
            display: flex;
            flex-wrap: nowrap;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem 2rem;
            overflow: hidden;
        }

        .social {
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            align-items: center;
            gap: 2rem;
        }

        .social>.social-icon {
            width: var(--brand-size);
            height: var(--brand-size);
            display: block;
            color: var(--social-text-color);
        }

        .social.social-discord>.social-icon {
            color: var(--brand-discord);
        }

        .social.social-facebook>.social-icon {
            color: var(--brand-facebook);
        }

        .social.social-kick>.social-icon {
            color: var(--brand-kick);
        }

        .social.social-tiktok>.social-icon {
            color: var(--brand-tiktok);
        }

        .social.social-x>.social-icon {
            color: var(--brand-x);
        }

        .social.social-twitch>.social-icon {
            color: var(--brand-twitch);
        }

        .social.social-youtube>.social-icon {
            color: var(--brand-youtube);
        }

        .social.social-youtubeshorts>.social-icon {
            color: var(--brand-youtubeshorts);
        }

        .social.social-instagram>.social-icon {
            color: var(--brand-instagram);
        }

        .social>.social-handle {
            letter-spacing: var(--social-letter-spacing);
            font-family: var(--social-font-family);
            font-weight: var(--social-font-weight);
            font-size: var(--social-font-size);
            color: var(--social-text-color);
        }

        .social > .social-handle .at {
            margin-right: 4px;
            font-weight: 300;
            font-size: 80%;
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <main id="social-container"></main>
    <template id="social-template">
        <div class="social">
            <span></span>
        </div>
    </template>
    <template id="base-template">
        <div class="social-base">
            <div class="social-list"></div>
        </div>
    </template>
    <script type="text/javascript" defer>
        (() => {
            "use strict";

            // =========================================================
            // CONFIGURAÇÕES PADRÃO
            // =========================================================

            const DEFAULTS = {
                socials: "kick:@oclovao",
                duration: 5000,
                animationIn: "fadeInUp",
                animationOut: "fadeOutDown",
                animationSpeed: ""
            };

            const NETWORK_ALIASES = {
                twitter: "x",
                youtube_shorts: "youtubeshorts",
                "youtube-shorts": "youtubeshorts",
                shorts: "youtubeshorts"
            };

            const ANIMATION_PREFIX = "animate__";

            // =========================================================
            // PARÂMETROS DA URL
            // =========================================================

            const params = new URLSearchParams(window.location.search);

            function getParam(name, fallback = "") {
                return params.get(name) ?? fallback;
            }

            function getNumber(name, fallback, min, max) {
                const value = Number(getParam(name, fallback));

                if (!Number.isFinite(value)) {
                    return fallback;
                }

                return Math.min(max, Math.max(min, value))
            }

            // =========================================================
            // ANIMATE.CSS
            // =========================================================

            function normalizeAnimation(name) {
                name = String(name || "").trim();

                if (!name || name.toLowerCase() === "none") {
                    return "";
                }

                // Permite informar somente o nome da animação.
                name = name.replace(/^animate__/i, "");

                if (!/^[a-zA-Z][a-zA-Z0-9_-]*$/.test(name)) {
                    return "";
                }

                // Não limita a biblioteca a uma lista de animações.
                return ANIMATION_PREFIX + name;
            }

            function normalizeSpeed(speed) {
                const speeds = {
                    slow: "animate__slow",
                    slower: "animate__slower",
                    fast: "animate__fast",
                    faster: "animate__faster"
                };

                return speeds[String(speed).toLowerCase()] || "";
            }

            const config = {
                duration: getNumber(
                    "duration",
                    DEFAULTS.duration,
                    500,
                    120000
                ),

                animationIn: normalizeAnimation(
                    getParam("animationIn", DEFAULTS.animationIn)
                ),

                animationOut: normalizeAnimation(
                    getParam("animationOut", DEFAULTS.animationOut)
                ),

                animationSpeed: normalizeSpeed(
                    getParam("animationSpeed", DEFAULTS.animationSpeed)
                )
            };

            // =========================================================
            // REDES SOCIAIS
            // =========================================================

            function normalizeNetwork(network) {
                network = String(network || "").trim().toLowerCase();

                return NETWORK_ALIASES[network] || network;
            }

            function parseSocials(value) {
                if (!value)
                    return [];

                return value
                    .split(",")
                    .map(item => {
                        const separator = item.indexOf(":");

                        if (separator === -1)
                            return null;

                        const network = normalizeNetwork(
                            item.slice(0, separator)
                        );

                        const handle = item.slice(separator + 1).trim();

                        if (!network || !handle)
                            return null;

                        // Confere se o ícone SVG está disponível no HTML.
                        if (!document.getElementById(`icon-${network}`)) {
                            console.warn(
                                `[Social Overlay] Rede não encontrada: ${network}`
                            );

                            return null
                        }

                        return {
                            network,
                            handle
                        }
                    })
                    .filter(Boolean)
            }

            // =========================================================
            // TEMPO INDIVIDUAL POR REDE
            // =========================================================

            function parseDurations(value) {
                const durations = {};

                if (!value) {
                    return durations;
                }

                value.split(",").forEach(item => {
                    const separator = item.indexOf(":");

                    if (separator === -1)
                        return;

                    const network = normalizeNetwork(
                        item.slice(0, separator)
                    );

                    const duration = Number(
                        item.slice(separator + 1)
                    );

                    if (
                        network &&
                        Number.isFinite(duration) &&
                        duration >= 500
                    ) {
                        durations[network] = Math.min(duration, 120000);
                    }
                });

                return durations
            }

            const individualDurations = parseDurations(
                getParam("durations")
            );

            function getSocialDuration(social) {
                return individualDurations[social.network] ??
                    config.duration;
            }

            // =========================================================
            // ELEMENTOS HTML
            // =========================================================

            const container = document.getElementById("social-container");
            const baseTemplate = document.getElementById("base-template");
            const socialTemplate = document.getElementById("social-template");

            if (!container) {
                console.error(
                    "[Social Overlay] #social-container não encontrado."
                );

                return
            }

            if (!baseTemplate || !socialTemplate) {
                console.error(
                    "[Social Overlay] Templates HTML não encontrados."
                );

                return
            }

            // =========================================================
            // ESTRUTURA PRINCIPAL
            // =========================================================

            const base = baseTemplate.content.cloneNode(true);

            container.replaceChildren(base);

            const socialList = container.querySelector(".social-list");

            if (!socialList) {
                console.error(
                    "[Social Overlay] .social-list não encontrado no template."
                );

                return
            }

            // Clona o template uma única vez.
            const socialElement = socialTemplate.content
                .firstElementChild
                ?.cloneNode(true);

            if (!socialElement) {
                console.error(
                    "[Social Overlay] Template de rede social inválido."
                );

                return
            }

            socialElement.classList.add("social");

            socialList.appendChild(socialElement);

            // =========================================================
            // CONFIGURAÇÃO DAS REDES
            // =========================================================

            const socials = parseSocials(
                getParam("socials", DEFAULTS.socials)
            );

            if (!socials.length) {
                console.warn(
                    "[Social Overlay] Nenhuma rede social válida configurada."
                );

                return
            }

            // =========================================================
            // RENDERIZAÇÃO
            // =========================================================

            let previousNetworkClass = "";

            function renderSocial(social) {
                const icon = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );

                const use = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "use"
                );

                icon.classList.add("social-icon");

                icon.setAttribute("aria-hidden", "true");
                icon.setAttribute("focusable", "false");

                use.setAttribute("href", `#icon-${social.network}`);

                icon.appendChild(use);

                // Cria o identificador sem interpretar HTML fornecido pela URL.
                const handle = document.createElement("span");

                handle.classList.add("social-handle");
                
                if (social.handle.startsWith("@")) {
                    const at = document.createElement("i");

                    at.classList.add("at");
                    at.textContent = "@";

                    handle.append(at, document.createTextNode(social.handle.slice(1)))
                } else
                    handle.textContent = social.handle;

                // Mantém as classes personalizadas do template.
                if (previousNetworkClass) {
                    socialElement.classList.remove(previousNetworkClass);
                }

                previousNetworkClass = `social-${social.network}`;

                socialElement.classList.add(previousNetworkClass);

                socialElement.replaceChildren(icon, handle);

                // Nenhum estilo inline é aplicado.
                // Toda a aparência fica sob controle do CSS.
            }

            // =========================================================
            // CONTROLE DAS ANIMAÇÕES
            // =========================================================

            function getAnimationDuration(element) {
                const style = getComputedStyle(element);

                if (style.animationName === "none")
                    return 0;

                function parseTimes(value) {
                    return value.split(",").map(item => {
                        item = item.trim();

                        if (item.endsWith("ms")) {
                            return parseFloat(item);
                        }

                        return parseFloat(item) * 1000;
                    })
                }

                const durations = parseTimes(style.animationDuration);
                const delays = parseTimes(style.animationDelay);

                return Math.max(
                    0,
                    ...durations.map((duration, index) => {
                        const delay = delays[index % delays.length] || 0;

                        return duration + delay;
                    })
                )
            }

            function playAnimation(element, animation) {
                return new Promise(resolve => {
                    if (!animation) {
                        resolve();
                        return
                    }

                    const classes = [
                        "animate__animated",
                        animation
                    ];

                    if (config.animationSpeed) {
                        classes.push(config.animationSpeed);
                    }

                    element.classList.remove(...classes);

                    // Reinicia a animação sem alterar o CSS.
                    void element.offsetWidth;

                    element.classList.add(...classes);

                    const duration = getAnimationDuration(element);

                    if (duration <= 0) {
                        element.classList.remove(...classes);
                        resolve();
                        return
                    }

                    setTimeout(() => {
                        element.classList.remove(...classes);
                        resolve();
                    }, duration + 50)
                })
            }

            // =========================================================
            // ALTERNÂNCIA AUTOMÁTICA
            // =========================================================

            let currentIndex = 0;
            let cycleTimer = null;
            let isTransitioning = false;

            function scheduleNext() {
                clearTimeout(cycleTimer);

                if (socials.length < 2)
                    return;

                const currentSocial = socials[currentIndex];

                cycleTimer = setTimeout(() => {
                    const nextIndex = (
                        currentIndex + 1
                    ) % socials.length;

                    showSocial(nextIndex);
                }, getSocialDuration(currentSocial));
            }

            async function showSocial(index) {
                if (isTransitioning)
                    return;

                isTransitioning = true;

                clearTimeout(cycleTimer);

                // Saída da rede atual.
                if (socialElement.dataset.network) {
                    await playAnimation(
                        socialElement,
                        config.animationOut
                    );
                }

                currentIndex = index;

                const social = socials[currentIndex];

                renderSocial(social);

                socialElement.dataset.network = social.network;

                // Entrada da próxima rede.
                await playAnimation(
                    socialElement,
                    config.animationIn
                );

                isTransitioning = false;

                scheduleNext()
            }

            // =========================================================
            // INICIALIZAÇÃO
            // =========================================================

            renderSocial(socials[0]);

            socialElement.dataset.network = socials[0].network;

            playAnimation(
                socialElement,
                config.animationIn
            ).then(scheduleNext)

        })()

    </script>
</body>

</html>
