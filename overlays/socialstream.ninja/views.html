<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Views Overlay - Social Stream Ninja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        type="text/css">
    <style type="text/css">
        @keyframes shimmer {
            60% {
                transform: inherit
            }

            100% {
                transform: skewX(-25deg) translateX(100%)
            }
        }

        @keyframes pop {

            0%,
            100% {
                transform: inherit;
            }

            50% {
                transform: scale(1.1);
            }
        }

        *,
        *:after,
        *:before {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        * {
            outline: 0;
            border: none;
            font-family: inherit;
            font-size: 100%;
            background: transparent;
            vertical-align: baseline
        }

        :root {
            --font-family: 'Noto Sans';
            --font-weight: 900;
            --font-color: #e8f2fa;
            --size: 56px;
        }

        body {
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        #platform_container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            transition: filter 180ms ease;
            -webkit-mask-image: linear-gradient(180deg, white 20%, white 80%, transparent 100%);
            mask-image: linear-gradient(180deg, white 20%, white 80%, transparent 100%);
        }

        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .platform {
            flex: 1 0;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 1rem 2rem;
            border: 1px solid #64748b;
            /*border-radius: 100px;*/
            overflow: hidden;
            box-shadow: 0 0 1rem rgba(249, 250, 251, .33) inset;
            background-color: rgba(31, 41, 55, .2);
            user-select: none;
            animation-name: fadeIn;
            animation-duration: 360ms;
            animation-timing-function: linear;
            animation-fill-mode: backwards;
            -webkit-backdrop-filter: blur(10px) grayscale(.8) opacity(.6);
            backdrop-filter: blur(10px) grayscale(.8) opacity(.6);
            position: relative;
        }

        .platform::after {
            content: '';
            background-image: linear-gradient(90deg, transparent 0%, #f9fafb 50%, transparent);
            -webkit-filter: opacity(.05);
            filter: opacity(.05);
            transform: skewX(40deg) translateX(-100%);
            animation-name: shimmer;
            animation-timing-function: linear;
            animation-fill-mode: alternate;
            animation-iteration-count: infinite;
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            top: 0;
        }

        .platform:nth-child(odd)::after {
            animation-duration: 2s;
            animation-delay: 5s;
        }

        .platform:nth-child(even)::after {
            animation-duration: 1s;
            animation-delay: 10s;
        }

        .icon {
            width: var(--size);
            height: var(--size);
            display: block;
            background-color: var(--font-color);
            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: var(--size);
            mask-image: url('https://i.imgur.com/fJjGz7i.png');
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-size: var(--size);
            -webkit-mask-image: url('https://i.imgur.com/fJjGz7i.png');
        }

        .icon.twitch {
            background-color: #6441a5;
            mask-image: url('https://i.imgur.com/DnG97p5.png');
            -webkit-mask-image: url('https://i.imgur.com/DnG97p5.png');
        }

        .icon.facebook {
            background-color: #005FED;
            mask-image: url('https://i.imgur.com/t8pQUvH.png');
            -webkit-mask-image: url('https://i.imgur.com/t8pQUvH.png');
        }

        .icon.youtube {
            background-color: #f80231;
            mask-image: url('https://i.imgur.com/PCyzV61.png');
            -webkit-mask-image: url('https://i.imgur.com/PCyzV61.png');
        }

        .icon.kick {
            background-color: #00e701;
            mask-image: url('https://i.imgur.com/GONwTVy.png');
            -webkit-mask-image: url('https://i.imgur.com/GONwTVy.png');
        }

        .icon.tiktok {
            background-color: #2af0ea;
            mask-image: url('https://i.imgur.com/paZ8nLv.png');
            -webkit-mask-image: url('https://i.imgur.com/paZ8nLv.png');
        }

        .views {
            display: inline-block;
            overflow: hidden;
            letter-spacing: 2px;
            line-height: var(--size);
            font-family: var(--font-family);
            font-weight: var(--font-weight);
            font-size: calc(var(--size) * .85);
            color: #e8f2fa;
            text-align: center;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }
    </style>
</head>

<body>
    <main id="platform_container"></main>
    <template id="platform-template">
        <div class="platform">
            <span class="icon"></span>
            <span class="views"></span>
        </div>
    </template>
    <script type="text/javascript">
(() => {
    'use strict';

    // ==========================================
    // DOM
    // ==========================================

    const container =
        document.getElementById('platform_container');

    const template =
        document.getElementById('platform-template');

    const params =
        new URLSearchParams(window.location.search);

    // ==========================================
    // CONFIG
    // ==========================================

    const CONFIG = {
        session:
            params.get('session') || '',

        password:
            params.get('password') || 'false',

        lanOnly:
            params.has('lanonly'),

        hasServerMode:
            params.has('server') ||
            params.has('server2') ||
            params.has('server3')
    };

    // ==========================================
    // STATE
    // ==========================================

    const state = new Map();
    const elements = new Map();
    const sockets = [];

    let iframe = null;
    let sequence = 0;

    // viewers atuais
    const viewerCounts =
        Object.create(null);

    // plataformas registradas no SSN
    // renderizadas imediatamente
    const registeredPlatforms =
        [
            'youtube',
            'twitch',
            'kick'
        ];

    // evita duplicação
    const registeredPlatformMap =
        new Set(registeredPlatforms);

    // ==========================================
    // HELPERS
    // ==========================================

    const wait = ms =>
        new Promise(resolve =>
            setTimeout(resolve, ms)
        );

    function parseNumber(value) {

        if (
            typeof value === 'number' &&
            Number.isFinite(value)
        ) {
            return value;
        }

        if (
            typeof value === 'string'
        ) {

            const cleaned =
                value.replace(
                    /[^0-9.-]/g,
                    ''
                );

            if (!cleaned) {
                return null;
            }

            const parsed =
                parseFloat(cleaned);

            return Number.isFinite(parsed)
                ? parsed
                : null;
        }

        return null;
    }

    function formatNumberShort(
        number,
        precision = 1
    ) {

        number = Number(number);

        if (number < 1000) {
            return number.toString();
        }

        const suffixes =
            ['K', 'M', 'B', 'T'];

        const suffixIndex =
            Math.floor(
                Math.log10(number) / 3
            ) - 1;

        const shortValue =
            number /
            Math.pow(
                1000,
                suffixIndex + 1
            );

        return `${parseFloat(
            shortValue.toFixed(
                precision
            )
        )}${suffixes[suffixIndex]}`;
    }

    function normalizeEventName(
        eventName
    ) {

        if (
            typeof eventName !==
            'string'
        ) {
            return '';
        }

        return eventName
            .toLowerCase()
            .replace(
                /[^a-z0-9]+/g,
                '_'
            )
            .replace(
                /_+/g,
                '_'
            )
            .replace(
                /^_+|_+$/g,
                ''
            );
    }

    function normalizePlatformName(
        platform
    ) {

        if (!platform) {
            return '';
        }

        platform =
            platform
                .toString()
                .toLowerCase()
                .trim();

        // YOUTUBE

        if (
            platform.includes('youtube') ||
            platform.includes('yt') ||
            platform.includes('youtubegaming') ||
            platform.includes('youtubegaming')
        ) {
            return 'youtube';
        }

        // TWITCH

        if (
            platform.includes('twitch')
        ) {
            return 'twitch';
        }

        // KICK

        if (
            platform.includes('kick')
        ) {
            return 'kick';
        }

        // FACEBOOK

        if (
            platform.includes('facebook') ||
            platform.includes('fb')
        ) {
            return 'facebook';
        }

        // TIKTOK

        if (
            platform.includes('tiktok') ||
            platform.includes('tik_tok')
        ) {
            return 'tiktok';
        }

        // TROVO

        if (
            platform.includes('trovo')
        ) {
            return 'trovo';
        }

        return platform
            .replace(
                /[^a-z0-9]/g,
                ''
            );
    }

    function isPlainObject(value) {

        return (
            Object.prototype.toString.call(
                value
            ) === '[object Object]'
        );
    }

    // ==========================================
    // PLATFORM REGISTRATION
    // ==========================================

    function registerPlatform(
        platform
    ) {

        platform =
            normalizePlatformName(
                platform
            );

        if (!platform) {
            return;
        }

        if (
            registeredPlatformMap.has(
                platform
            )
        ) {
            return;
        }

        registeredPlatformMap.add(
            platform
        );

        registeredPlatforms.push(
            platform
        );

        if (
            viewerCounts[
            platform
            ] === undefined
        ) {
            viewerCounts[
                platform
            ] = 0;
        }
    }

    function registerPlatformsFromPayload(
        data
    ) {

        const possiblePlatforms = [];

        if (data.platform) {
            possiblePlatforms.push(
                data.platform
            );
        }

        if (data.type) {
            possiblePlatforms.push(
                data.type
            );
        }

        if (
            isPlainObject(data.meta)
        ) {

            Object.keys(data.meta)
                .forEach(platform => {
                    possiblePlatforms.push(
                        platform
                    );
                });
        }

        // procura em arrays vindos do SSN

        const sourceArrays = [
            data.sources,
            data.accounts,
            data.channels,
            data.destinations
        ];

        sourceArrays.forEach(array => {

            if (!Array.isArray(array)) {
                return;
            }

            array.forEach(item => {

                if (
                    typeof item === 'string'
                ) {
                    possiblePlatforms.push(
                        item
                    );
                    return;
                }

                if (
                    typeof item === 'object' &&
                    item
                ) {

                    possiblePlatforms.push(
                        item.type
                    );

                    possiblePlatforms.push(
                        item.platform
                    );

                    possiblePlatforms.push(
                        item.name
                    );
                }
            });
        });

        possiblePlatforms.forEach(
            registerPlatform
        );
    }

    // ==========================================
    // ENTRY
    // ==========================================

    function setEntry({
        id,
        platform,
        value,
        label,
        order
    }) {

        if (!id) {
            return;
        }

        const existing =
            state.get(id);

        state.set(id, {
            id,
            platform,
            value,
            label,
            order,
            sequence:
                existing?.sequence ??
                ++sequence
        });
    }

    // ==========================================
    // VIEWERS
    // ==========================================

    function syncViewerEntries() {

        let total = 0;

        // TOTAL sempre primeiro

        setEntry({
            id: 'viewer-total',
            platform: 'total',
            label: 'Total Viewers',
            value: 0,
            order: 0
        });

        registeredPlatforms.forEach(
            (
                platform,
                index
            ) => {

                const numeric =
                    parseNumber(
                        viewerCounts[
                        platform
                        ] ?? 0
                    ) ?? 0;

                total += numeric;

                setEntry({
                    id:
                        `viewer-${platform}`,

                    platform,

                    label:
                        `${platform.toUpperCase()} Viewers`,

                    value: numeric,

                    // ordem exata do SSN
                    order:
                        index + 1
                });
            }
        );

        // atualiza total

        const totalEntry =
            state.get(
                'viewer-total'
            );

        if (totalEntry) {
            totalEntry.value = total;
        }

        render();
    }

    // ==========================================
    // ANIMATION
    // ==========================================

    async function animateUpdate(
        element
    ) {

        element.classList.remove(
            'animate-pop'
        );

        void element.offsetWidth;

        element.classList.add(
            'animate-pop'
        );

        await wait(400);

        element.classList.remove(
            'animate-pop'
        );
    }

    // ==========================================
    // CREATE ELEMENT
    // ==========================================

    function createPlatformElement(
        entry
    ) {

        const fragment =
            template.content.cloneNode(
                true
            );

        const base =
            fragment.querySelector(
                '.platform'
            );

        const icon =
            fragment.querySelector(
                '.icon'
            );

        const views =
            fragment.querySelector(
                '.views'
            );

        base.dataset.platform =
            entry.platform;

        base.classList.add(
            entry.platform
        );

        icon?.classList.add(
            entry.platform
        );

        views.dataset.value =
            entry.value;

        views.textContent =
            formatNumberShort(
                entry.value
            );

        container.appendChild(
            base
        );

        elements.set(
            entry.platform,
            {
                base,
                views
            }
        );
    }

    // ==========================================
    // UPDATE ELEMENT
    // ==========================================

    function updatePlatformElement(
        entry
    ) {

        const element =
            elements.get(
                entry.platform
            );

        if (!element) {
            createPlatformElement(
                entry
            );
            return;
        }

        const currentValue =
            Number(
                element.views.dataset
                    .value
            );

        if (
            currentValue ===
            entry.value
        ) {
            return;
        }

        element.views.dataset.value =
            entry.value;

        element.views.textContent =
            formatNumberShort(
                entry.value
            );

        animateUpdate(
            element.views
        );
    }

    // ==========================================
    // RENDER
    // ==========================================

    function render() {

        const entries =
            [...state.values()]
                .sort(
                    (a, b) => {

                        if (
                            a.order !==
                            b.order
                        ) {
                            return (
                                a.order -
                                b.order
                            );
                        }

                        return (
                            a.sequence -
                            b.sequence
                        );
                    }
                );

        // renderiza tudo primeiro

        entries.forEach(
            updatePlatformElement
        );

        // reorganiza DOM

        entries.forEach(entry => {

            const element =
                elements.get(
                    entry.platform
                );

            if (
                element?.base
            ) {
                container.appendChild(
                    element.base
                );
            }
        });
    }

    // ==========================================
    // PAYLOAD
    // ==========================================

    function processPayload(data) {

        if (
            !data ||
            typeof data !==
            'object'
        ) {
            return;
        }

        if (
            data.content &&
            typeof data.content ===
            'object'
        ) {

            data = data.content;
        }

        // registra plataformas detectadas

        registerPlatformsFromPayload(
            data
        );

        const eventName =
            normalizeEventName(
                data.event ||
                data.type ||
                ''
            );

        const meta =
            data.meta;

        // ==========================================
        // SINGLE PLATFORM
        // ==========================================

        if (
            eventName ===
            'viewer_update'
        ) {

            const platform =
                normalizePlatformName(
                    data.platform ||
                    data.type ||
                    ''
                );

            const count =
                parseNumber(meta);

            if (
                !platform ||
                count === null
            ) {
                return;
            }

            registerPlatform(
                platform
            );

            // soma múltiplas lives da mesma plataforma

            viewerCounts[
                platform
            ] = count;

            syncViewerEntries();

            return;
        }

        // ==========================================
        // MULTIPLE PLATFORMS
        // ==========================================

        if (
            eventName ===
            'viewer_updates'
        ) {

            if (
                !isPlainObject(meta)
            ) {
                syncViewerEntries();
                return;
            }

            // reset apenas das plataformas conhecidas

            registeredPlatforms.forEach(
                platform => {
                    viewerCounts[
                        platform
                    ] = 0;
                }
            );

            Object.entries(meta)
                .forEach(
                    ([platform, value]) => {

                        platform =
                            normalizePlatformName(
                                platform
                            );

                        const count =
                            parseNumber(
                                value
                            );

                        if (
                            !platform ||
                            count === null
                        ) {
                            return;
                        }

                        registerPlatform(
                            platform
                        );

                        // soma múltiplas entradas

                        viewerCounts[
                            platform
                        ] =
                            (
                                viewerCounts[
                                platform
                                ] || 0
                            ) + count;
                    }
                );

            syncViewerEntries();
        }

        // fallback

        syncViewerEntries();
    }

    // ==========================================
    // INCOMING DATA
    // ==========================================

    function processIncomingData(
        raw
    ) {

        if (
            !raw ||
            typeof raw !==
            'object'
        ) {
            return;
        }

        if (
            raw.dataReceived
                ?.overlayNinja
        ) {

            processPayload(
                raw.dataReceived
                    .overlayNinja
            );

            return;
        }

        if (
            raw.overlayNinja
        ) {

            processPayload(
                raw.overlayNinja
            );

            return;
        }

        processPayload(raw);
    }

    // ==========================================
    // IFRAME
    // ==========================================

    function connectIframe() {

        if (
            !CONFIG.session ||
            CONFIG.hasServerMode
        ) {
            return;
        }

        const password =
            encodeURIComponent(
                CONFIG.password
            );

        const lanOnly =
            CONFIG.lanOnly
                ? '&lanonly'
                : '';

        iframe =
            document.createElement(
                'iframe'
            );

        iframe.src =
            `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&notmobile&password=${password + lanOnly}&solo&view=${encodeURIComponent(CONFIG.session)}&novideo&noaudio&label=meta&cleanoutput&room=${encodeURIComponent(CONFIG.session)}`;

        iframe.style.cssText = `
            width:0;
            height:0;
            position:fixed;
            left:-100px;
            top:-100px;
            border:0;
            pointer-events:none;
        `;

        document.body.appendChild(
            iframe
        );
    }

    // ==========================================
    // SOCKET
    // ==========================================

    function connectSocket({
        url,
        roomId,
        out,
        inChannel
    }) {

        if (
            !url ||
            !roomId
        ) {
            return;
        }

        const connection = {
            socket: null,
            timer: null,
            attempts: 1,
            closed: false
        };

        sockets.push(connection);

        function reconnect() {

            if (
                connection.closed
            ) {
                return;
            }

            clearTimeout(
                connection.timer
            );

            const delay =
                Math.min(
                    12000,
                    250 *
                    connection.attempts
                );

            connection.timer =
                setTimeout(
                    connect,
                    delay
                );

            connection.attempts++;
        }

        function connect() {

            if (
                connection.closed
            ) {
                return;
            }

            try {

                connection.socket =
                    new WebSocket(
                        url
                    );

            } catch {

                reconnect();
                return;
            }

            connection.socket.onopen =
                () => {

                    connection.attempts = 1;

                    connection.socket.send(
                        JSON.stringify({
                            join:
                                roomId,
                            out,
                            in:
                                inChannel
                        })
                    );
                };

            connection.socket.onmessage =
                event => {

                    if (
                        !event?.data
                    ) {
                        return;
                    }

                    try {

                        const parsed =
                            JSON.parse(
                                event.data
                            );

                        processIncomingData(
                            parsed
                        );

                        if (
                            parsed?.get
                        ) {

                            connection.socket.send(
                                JSON.stringify({
                                    callback: {
                                        get:
                                            parsed.get,
                                        result: true
                                    }
                                })
                            );
                        }

                    } catch { }
                };

            connection.socket.onerror =
                () => {

                    try {

                        connection.socket.close();

                    } catch { }
                };

            connection.socket.onclose =
                reconnect;
        }

        connect();
    }

    // ==========================================
    // SERVER MODES
    // ==========================================

    function connectServerModes() {

        const roomId =
            CONFIG.session
                .split(',')[0];

        if (!roomId) {
            return;
        }

        // API SERVER

        if (
            params.has('server')
        ) {

            const url =
                params.get(
                    'server'
                ) ||
                (
                    params.has(
                        'localserver'
                    )
                        ? 'ws://127.0.0.1:3000'
                        : 'wss://io.socialstream.ninja/api'
                );

            connectSocket({
                url,
                roomId,
                out: 2,
                inChannel: 1
            });
        }

        // EXTENSION SERVER

        if (
            params.has(
                'server2'
            ) ||
            params.has(
                'server3'
            )
        ) {

            const url =
                params.has(
                    'server2'
                )
                    ? (
                        params.get(
                            'server2'
                        ) ||
                        'wss://io.socialstream.ninja/extension'
                    )
                    : (
                        params.get(
                            'server3'
                        ) ||
                        'wss://io.socialstream.ninja/extension'
                    );

            connectSocket({
                url,
                roomId,
                out: 3,
                inChannel: 4
            });
        }
    }

    // ==========================================
    // MESSAGE LISTENER
    // ==========================================

    window.addEventListener(
        'message',
        event => {

            let payload =
                null;

            if (
                event?.data
                    ?.dataReceived
                    ?.overlayNinja
            ) {

                if (
                    iframe &&
                    event.source !==
                    iframe.contentWindow
                ) {
                    return;
                }

                payload =
                    event.data
                        .dataReceived
                        .overlayNinja;
            }

            else if (
                event?.data
                    ?.overlayNinja
            ) {

                payload =
                    event.data
                        .overlayNinja;
            }

            if (payload) {
                processIncomingData(
                    payload
                );
            }
        }
    );

    // ==========================================
    // CLEANUP
    // ==========================================

    window.addEventListener(
        'beforeunload',
        () => {

            sockets.forEach(
                connection => {

                    connection.closed =
                        true;

                    clearTimeout(
                        connection.timer
                    );

                    if (
                        connection.socket
                    ) {

                        try {

                            connection.socket.onclose =
                                null;

                            connection.socket.close();

                        } catch { }
                    }
                }
            );
        }
    );

    // ==========================================
    // INIT
    // ==========================================

    // render inicial completo

    registeredPlatforms.forEach(
        platform => {
            viewerCounts[platform] = 0;
        }
    );

    syncViewerEntries();

    connectServerModes();

    connectIframe();

})();
