<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Overlay - Social Stream Ninja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" type="text/css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style type="text/css">
        @charset 'UTF-8';

        *,
        *:after,
        *:before {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        * {
            outline: 0;
            border: none;
            font-family: inherit;
            font-size: 100%;
            background: transparent;
            vertical-align: baseline
        }

        :root {
            --background-color: #f9fafb;
            --badge-size: 28px;
            --emote-size: 42px;
            --message-background-color: #cbd5e1;
            --message-letter-spacing: 1px;
            --message-font-family: 'Noto Sans';
            --message-font-weight: 600;
            --message-font-size: 22px;
            --message-text-color: #030712;
        }

        body {
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        .main-container {
            max-width: 100vw;
            height: 100vh;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            gap: 1rem;
            padding: 0 1rem 1rem;
            position: relative;
            -webkit-mask-image: linear-gradient(0deg, transparent 0%, white 2%, white 80%, transparent 100%);
            mask-image: linear-gradient(0deg, transparent 0%, white 2%, white 80%, transparent 100%);
            user-select: none;
        }

        .main-container.reverse {
            flex-direction: column-reverse;
        }

        .chat {
            --header-height: calc(var(--message-font-size) * 2);
            --message-background-color: #f9fafb;
            --message-text-color: #030712;

            flex: 0 0 auto;
            max-height: 0;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            align-items: flex-start;
            overflow: hidden;
            font-family: var(--message-font-family);
            animation-name: fadeInUp, fadeOutUp;
            animation-duration: 240ms;
            animation-timing-function: linear, ease-out;
            animation-fill-mode: backwards, forwards;
            transition: max-height 500ms;
        }

        .chat.dark {
            --message-background-color: #0e0e10;
            --message-text-color: #f9fafb;
        }

        .chat-header {
            z-index: 2;
            flex: 1 0;
            height: var(--header-height);
            line-height: var(--header-height);
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .chat-user-badges {
            flex: 0 1;
            height: calc(var(--badge-size) * 2);
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            line-height: calc(var(--badge-size) * 2);
            background-color: transparent;
            transform: scale(.9);
        }

        .chat-user-badges:not(:empty) {
            padding: 0 15px;
        }

        .chat-user-badges>* {
            min-width: var(--badge-size);
            max-height: var(--badge-size);
            display: block;
            object-fit: cover;
        }

        .source {
            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: var(--badge-size);
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-size: var(--badge-size);
        }

        .source.twitch {
            background-color: #6441a5;
            mask-image: url('https://i.imgur.com/DnG97p5.png');
            -webkit-mask-image: url('https://i.imgur.com/DnG97p5.png');
        }

        .source.facebook {
            background-color: #005FED;
            mask-image: url('https://i.imgur.com/t8pQUvH.png');
            -webkit-mask-image: url('https://i.imgur.com/t8pQUvH.png');
        }

        .source.youtube,
        .source.youtubeshorts {
            background-color: #f80231;
            mask-image: url('https://i.imgur.com/PCyzV61.png');
            -webkit-mask-image: url('https://i.imgur.com/PCyzV61.png');
        }

        .source.kick {
            background-color: #00e701;
            mask-image: url('https://i.imgur.com/GONwTVy.png');
            -webkit-mask-image: url('https://i.imgur.com/GONwTVy.png');
        }

        .source.tiktok {
            background-color: #2af0ea;
            mask-image: url('https://i.imgur.com/paZ8nLv.png');
            -webkit-mask-image: url('https://i.imgur.com/paZ8nLv.png');
        }

        .chat-user-name {
            --color: #030712;

            flex: 1 0;
            height: var(--header-height);
            display: block;
            white-space: nowrap;
            overflow: hidden;
            border-radius: 5px;
            padding: 0 20px;
            background-color: var(--color);
            letter-spacing: calc(var(--message-letter-spacing) * 2);
            font-weight: 700;
            font-size: calc(var(--message-font-size) * 1.1);
            transition: background-color 240ms;
        }

        .chat-user-name:not(.dark-text) {
            color: #0e0e10;
        }

        .chat-user-name.dark-text {
            color: #f9fafb;
        }

        .chat:nth-of-type(3n + 1) .chat-user-name:not(.own) {
            background-color: #2c4b7d !important;
        }

        .chat:nth-of-type(3n + 2) .chat-user-name:not(.own) {
            background-color: #e2612f !important;
        }

        .chat:nth-of-type(3n + 3) .chat-user-name:not(.own) {
            background-color: #b42f41 !important;
        }

        .chat-message {
            z-index: 1;
            display: flex;
            padding: 15px 20px;
            border: 2px solid #64748b;
            border-radius: 0 10px 10px;
            margin-left: 1rem;
            background-color: var(--message-background-color);
            color: var(--message-text-color);
        }

        .chat-message-content {
            flex: 0 0 100%;
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
            overflow-wrap: break-word;
            line-height: calc(var(--message-font-size) * 1.33);
            letter-spacing: var(--message-letter-spacing);
            font-weight: var(--message-font-weight);
            font-size: var(--message-font-size);
            color: var(--message-text-color);
        }

        .chat-message-content .emote,
        .chat-message-content .mention,
        .chat-message-content .link {
            display: inline-block;
            margin: 0 5px;
        }

        .chat-message-content .mention,
        .chat-message-content .link {
            --color-rgb: 85, 136, 255;

            letter-spacing: 1px;
            color: rgb(var(--color-rgb));
        }

        .chat-message-content .mention {
            padding: 0 10px;
            border-radius: 5px;
            font-weight: 700;
            background-color: rgba(var(--color-rgb), .1);
        }

        .chat:not(.dark) .chat-message-content .mention {
            background-color: rgba(var(--color-rgb), .4);
        }

        .chat-message-content img,
        .chat-message-content .emote,
        .chat-message-content .emote>* {
            width: var(--emote-size);
            height: auto;
        }

        .chat-message-content img,
        .chat-message-content .emote {
            background-size: cover;
            background-repeat: no-repeat;
        }

        .chat-message-content img,
        .chat-message-content .emote>* {
            -o-object-fit: cover;
            object-fit: cover;
        }

        .chat-message-content .link {
            font-weight: 300;
        }
    </style>
</head>

<body>
    <main class="main-container"></main>

    <template id="message-template">
        <article class="chat">
            <header class="chat-header">
                <span class="chat-user-name"></span>
                <aside class="chat-user-badges badges"></aside>
            </header>
            <div class="chat-message">
                <div class="chat-message-content"></div>
            </div>
        </article>
    </template>
    <template id="link-template">
        <span class="link"></span>
    </template>
    <template id="mention-template">
        <span class="mention"></span>
    </template>

    <script type="text/javascript" defer>
        (() => {
            'use strict';

            // ==========================================
            // URL PARAMS / CONFIG
            // ==========================================

            const urlParams =
                new URLSearchParams(
                    window.location.search.toLowerCase()
                );

            const CONFIG = {
                roomID:
                    urlParams.get('session') || 'iWWnKL28tQ',

                password: 'false',

                featuredMode: false,

                reversed:
                    urlParams.has('reverse'),

                darkMode:
                    urlParams.has('darkmode'),

                hideCommands:
                    urlParams.has('hidecommands'),

                useUserColor:
                    urlParams.has('usercolor'),

                messageDuration:
                    Number(urlParams.get('messageduration')) || 30000,

                maxBadges:
                    Number(urlParams.get('limitbadges')) || Infinity,

                maxMessages:
                    Number(urlParams.get('limit')) || Infinity,

                serverURL:
                    urlParams.get('server') ||
                    urlParams.get('server2') ||
                    (
                        urlParams.has('localserver')
                            ? 'ws://127.0.0.1:3000'
                            : 'wss://io.socialstream.ninja'
                    ),

                useSocket:
                    urlParams.has('server') ||
                    urlParams.has('server2')
            };

            // ==========================================
            // DOM
            // ==========================================

            const DOM = {
                container:
                    document.querySelector('.main-container'),

                templates: {
                    message:
                        document.getElementById('message-template'),

                    link:
                        document.getElementById('link-template'),

                    mention:
                        document.getElementById('mention-template')
                }
            };

            // ==========================================
            // STATE
            // ==========================================

            const state = {
                socket: null,
                reconnectAttempts: 0,
                messageTimers: new Map()
            };

            // ==========================================
            // INIT DOM
            // ==========================================

            if (CONFIG.reversed) {
                DOM.container.classList.add('reverse');
            }

            // ==========================================
            // HELPERS
            // ==========================================

            const isObject = value =>
                value !== null &&
                typeof value === 'object';

            const safeText = value =>
                value?.toString?.() || '';

            const nextFrame = () =>
                new Promise(resolve =>
                    requestAnimationFrame(resolve)
                );

            const createElement = (
                tag,
                className = ''
            ) => {

                const element =
                    document.createElement(tag);

                if (className) {
                    element.className = className;
                }

                return element;
            };

            function normalizeColor(color) {

                if (!color) {
                    return '';
                }

                let normalized =
                    safeText(color).trim();

                // Adiciona # automaticamente
                if (
                    /^[A-Fa-f0-9]{6}$/.test(normalized)
                ) {
                    normalized = `#${normalized}`;
                }

                // Adiciona # automaticamente (#RGB)
                if (
                    /^[A-Fa-f0-9]{3}$/.test(normalized)
                ) {
                    normalized = `#${normalized}`;
                }

                const temp =
                    document.createElement('div');

                temp.style.color = normalized;

                document.body.appendChild(temp);

                const computed =
                    getComputedStyle(temp).color;

                temp.remove();

                return computed;
            }

            function isDarkColor(color) {

                const normalized =
                    normalizeColor(color);

                const rgbMatch =
                    normalized.match(
                        /^rgba?\((\d+),\s*(\d+),\s*(\d+)/i
                    );

                if (!rgbMatch) {
                    return false;
                }

                const r = Number(rgbMatch[1]);
                const g = Number(rgbMatch[2]);
                const b = Number(rgbMatch[3]);

                const brightness =
                    (r * 299 + g * 587 + b * 114) / 1000;

                return brightness < 122;
            }

            function getTrueHeight(element) {

                if (!element) {
                    return 0;
                }

                const style =
                    getComputedStyle(element);

                const parentStyle =
                    element.parentElement
                        ? getComputedStyle(
                            element.parentElement
                        )
                        : null;

                return (
                    element.scrollHeight +
                    (parseFloat(style.gap) || 0) +
                    (parseFloat(parentStyle?.gap) || 0)
                );
            }

            // ==========================================
            // MESSAGE FORMATTERS
            // ==========================================

            function createTemplateHTML(
                template,
                selector,
                text
            ) {

                const fragment =
                    template?.content?.cloneNode(true);

                const element =
                    fragment?.querySelector(selector);

                if (!element) {
                    return text;
                }

                element.textContent = text;

                return element.outerHTML;
            }

            function formatMessageText(text = '') {

                let formatted =
                    safeText(text);

                formatted = formatted.replace(
                    /(?<![\(\"\'\=])(https?\:\/\/[^\s\<\>\"\'\)]+)/gi,
                    match =>
                        createTemplateHTML(
                            DOM.templates.link,
                            '.link',
                            match
                        )
                );

                formatted = formatted.replace(
                    /\@([A-Za-z0-9\-\_]{4,})/gi,
                    match =>
                        createTemplateHTML(
                            DOM.templates.mention,
                            '.mention',
                            match
                        )
                );

                return formatted;
            }

            // ==========================================
            // BADGES / SOURCE
            // ==========================================

            function createBadge(src) {

                if (!src) {
                    return null;
                }

                const image =
                    new Image();

                const element =
                    createElement('img', 'badge');

                image.onload = ({ target }) => {
                    element.src = target.src;
                };

                image.src = src;

                return element;
            }

            function createSVGadge(html) {

                if (!html) {
                    return null;
                }

                const wrapper =
                    createElement('span', 'badge');

                const svg =
                    document.createElement('svg');

                svg.innerHTML = html;

                wrapper.appendChild(svg);

                return wrapper;
            }

            function createSource(platform) {

                if (!platform) {
                    return null;
                }

                return createElement(
                    'span',
                    `source ${platform}`
                );
            }

            // ==========================================
            // MESSAGE REMOVE
            // ==========================================

            function removeMessage(messageElement) {

                if (!messageElement?.parentNode) {
                    return;
                }

                const messageId =
                    messageElement.id;

                const timeout =
                    state.messageTimers.get(messageId);

                if (timeout) {

                    clearTimeout(timeout);

                    state.messageTimers.delete(
                        messageId
                    );
                }

                messageElement.remove();
            }

            // ==========================================
            // MESSAGE CREATE
            // ==========================================

            async function addMessageToOverlay(data) {

                if (!data) {
                    return;
                }

                const {
                    chatname,
                    chatmessage,
                    hasDonation,
                    donation,
                    type,
                    chatbadges,
                    mid
                } = data;

                const userColor =
                    data.nameColor ||
                    data.chatnameColor ||
                    data.textColor ||
                    data.color ||
                    '#030712';

                // ==========================================
                // VALIDATION
                // ==========================================

                if (
                    !chatname ||
                    !chatmessage ||
                    hasDonation ||
                    donation
                ) {
                    return;
                }

                if (
                    CONFIG.hideCommands &&
                    chatmessage.startsWith('!')
                ) {
                    return;
                }

                // ==========================================
                // TEMPLATE
                // ==========================================

                const fragment =
                    DOM.templates.message.content.cloneNode(true);

                const messageElement =
                    fragment.querySelector('.chat');

                const usernameElement =
                    fragment.querySelector('.chat-user-name');

                const badgesContainer =
                    fragment.querySelector('.chat-user-badges');

                const messageContent =
                    fragment.querySelector('.chat-message-content');

                const messageId =
                    mid ||
                    `msg-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

                // ==========================================
                // ATTRIBUTES
                // ==========================================

                messageElement.id = messageId;

                messageElement.dataset.platform =
                    type || '';

                messageElement.dataset.from =
                    chatname;

                messageElement.classList.toggle(
                    'dark',
                    CONFIG.darkMode
                );

                usernameElement.classList.toggle(
                    'own',
                    CONFIG.useUserColor
                );

                // ==========================================
                // SOURCE
                // ==========================================

                if (type) {

                    const source =
                        createSource(type);

                    if (source) {
                        badgesContainer.appendChild(source);
                    }
                }

                // ==========================================
                // BADGES
                // ==========================================

                if (Array.isArray(chatbadges)) {

                    for (
                        const badge of
                        chatbadges.slice(0, CONFIG.maxBadges)
                    ) {

                        let badgeElement = null;

                        if (isObject(badge)) {

                            if (
                                badge.type === 'img' &&
                                badge.src
                            ) {

                                badgeElement =
                                    createBadge(badge.src);
                            }

                            else if (
                                badge.type === 'svg' &&
                                badge.html
                            ) {

                                badgeElement =
                                    createSVGadge(badge.html);
                            }

                        } else {

                            badgeElement =
                                createBadge(badge);
                        }

                        if (badgeElement) {
                            badgesContainer.appendChild(
                                badgeElement
                            );
                        }
                    }
                }

                // ==========================================
                // USERNAME
                // ==========================================

                usernameElement.textContent =
                    chatname;

                if (
                    CONFIG.useUserColor &&
                    userColor
                ) {
                    const normalizedColor =
                        normalizeColor(userColor);

                    if (normalizedColor) {

                        usernameElement.style.setProperty(
                            '--color',
                            normalizedColor,
                            'important'
                        );

                        usernameElement.classList.toggle(
                            'dark-text',
                            isDarkColor(normalizedColor)
                        );
                    }
                }

                // ==========================================
                // MESSAGE
                // ==========================================

                messageContent.innerHTML =
                    formatMessageText(chatmessage);

                // ==========================================
                // INSERT
                // ==========================================

                if (CONFIG.reversed) {

                    const firstMessage =
                        DOM.container.querySelector('.chat');

                    if (firstMessage) {

                        DOM.container.insertBefore(
                            messageElement,
                            firstMessage
                        );

                    } else {

                        DOM.container.appendChild(
                            messageElement
                        );
                    }

                } else {

                    DOM.container.appendChild(
                        messageElement
                    );
                }

                // ==========================================
                // FORCE REFLOW
                // ==========================================

                void messageElement.offsetWidth;

                DOM.container.scrollTo({
                    top: DOM.container.scrollHeight,
                    behavior: 'smooth'
                });

                await nextFrame();

                messageElement.style.setProperty(
                    'max-height',
                    `${getTrueHeight(messageElement)}px`,
                    'important'
                );

                messageElement.style.setProperty(
                    'animation-delay',
                    `0s, ${CONFIG.messageDuration}ms`
                );

                // ==========================================
                // AUTO REMOVE
                // ==========================================

                const timeout =
                    setTimeout(() => {

                        removeMessage(
                            messageElement
                        );

                    }, CONFIG.messageDuration + 250);

                state.messageTimers.set(
                    messageId,
                    timeout
                );

                // ==========================================
                // LIMIT
                // ==========================================

                const messages =
                    DOM.container.querySelectorAll('.chat');

                if (
                    messages.length >
                    CONFIG.maxMessages
                ) {

                    const oldestMessage =
                        CONFIG.reversed
                            ? messages[messages.length - 1]
                            : messages[0];

                    if (oldestMessage) {
                        removeMessage(oldestMessage);
                    }
                }
            }

            // ==========================================
            // IFRAME BRIDGE
            // ==========================================

            function createBridgeIframe() {

                const iframe =
                    document.createElement('iframe');

                iframe.src =
                    CONFIG.featuredMode
                        ? `https://vdo.socialstream.ninja/?ln&password=${CONFIG.password}&salt=vdo.ninja&label=overlay&exclude=${CONFIG.roomID}&scene&novideo&noaudio&cleanoutput&room=${CONFIG.roomID}`
                        : `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=${CONFIG.password}&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=${CONFIG.roomID}`;

                iframe.allow =
                    'midi;geolocation;microphone;';

                iframe.style.cssText = `
            width:0;
            height:0;
            position:fixed;
            left:-100px;
            top:-100px;
            border:0;
            pointer-events:none;
        `;

                document.body.appendChild(iframe);

                window.addEventListener(
                    'message',
                    ({ source, data }) => {

                        if (
                            source !==
                            iframe.contentWindow
                        ) {
                            return;
                        }

                        const overlayData =
                            data?.dataReceived?.overlayNinja;

                        if (!overlayData) {
                            return;
                        }

                        addMessageToOverlay(
                            overlayData
                        );
                    }
                );

                return iframe;
            }

            // ==========================================
            // WEBSOCKET
            // ==========================================

            function connectSocket() {

                if (!CONFIG.useSocket) {
                    return;
                }

                if (state.socket) {
                    state.socket.close();
                }

                state.socket =
                    new WebSocket(
                        CONFIG.serverURL
                    );

                state.socket.onopen = () => {

                    state.reconnectAttempts = 0;

                    state.socket.send(
                        JSON.stringify({
                            join: CONFIG.roomID,
                            out: 3,
                            in: 4
                        })
                    );
                };

                state.socket.onmessage =
                    ({ data }) => {

                        if (!data) {
                            return;
                        }

                        try {

                            const parsed =
                                JSON.parse(data);

                            if (parsed) {
                                addMessageToOverlay(parsed);
                            }

                        } catch (error) {

                            console.error(
                                '[WebSocket] Parse error:',
                                error,
                                data
                            );
                        }
                    };

                state.socket.onerror =
                    error => {

                        console.error(
                            '[WebSocket] Error:',
                            error
                        );
                    };

                state.socket.onclose = () => {

                    state.reconnectAttempts++;

                    const reconnectDelay =
                        Math.min(
                            100 *
                            state.reconnectAttempts,
                            5000
                        );

                    setTimeout(
                        connectSocket,
                        reconnectDelay
                    );
                };
            }

            // ==========================================
            // VISIBILITY RECOVERY
            // ==========================================

            document.addEventListener(
                'visibilitychange',
                () => {

                    if (
                        document.visibilityState === 'visible' &&
                        CONFIG.useSocket &&
                        (
                            !state.socket ||
                            state.socket.readyState !== WebSocket.OPEN
                        )
                    ) {

                        connectSocket();
                    }
                }
            );

            // ==========================================
            // INIT
            // ==========================================

            createBridgeIframe();

            connectSocket();

        })();
    </script>
</body>

</html>
