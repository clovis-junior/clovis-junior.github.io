<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Views Overlay - Social Stream Ninja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        type="text/css">
    <style type="text/css">
        @keyframes shimmer {
            60% {
                transform: inherit
            }

            100% {
                transform: skewX(-25deg) translateX(100%)
            }
        }

        @keyframes pop {

            0%,
            100% {
                transform: inherit;
            }

            50% {
                transform: scale(1.1);
            }
        }

        *,
        *:after,
        *:before {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        * {
            outline: 0;
            border: none;
            font-family: inherit;
            font-size: 100%;
            background: transparent;
            vertical-align: baseline
        }

        :root {
            --font-family: 'Noto Sans';
            --font-weight: 900;
            --font-color: #e8f2fa;
            --size: 56px;
        }

        body {
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        #platform_container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            transition: filter 180ms ease;
            -webkit-mask-image: linear-gradient(180deg, white 20%, white 80%, transparent 100%);
            mask-image: linear-gradient(180deg, white 20%, white 80%, transparent 100%);
        }

        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .platform {
            flex: 1 0;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 1rem 2rem;
            border: 1px solid #64748b;
            /*border-radius: 100px;*/
            overflow: hidden;
            box-shadow: 0 0 1rem rgba(249, 250, 251, .33) inset;
            background-color: rgba(31, 41, 55, .2);
            user-select: none;
            animation-name: fadeIn;
            animation-duration: 360ms;
            animation-timing-function: linear;
            animation-fill-mode: backwards;
            -webkit-backdrop-filter: blur(10px) grayscale(.8) opacity(.6);
            backdrop-filter: blur(10px) grayscale(.8) opacity(.6);
            position: relative;
        }

        .platform::after {
            content: '';
            background-image: linear-gradient(90deg, transparent 0%, #f9fafb 50%, transparent);
            -webkit-filter: opacity(.05);
            filter: opacity(.05);
            transform: skewX(40deg) translateX(-100%);
            animation-name: shimmer;
            animation-timing-function: linear;
            animation-fill-mode: alternate;
            animation-iteration-count: infinite;
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            top: 0;
        }

        .platform:nth-child(odd)::after {
            animation-duration: 2s;
            animation-delay: 5s;
        }

        .platform:nth-child(even)::after {
            animation-duration: 1s;
            animation-delay: 10s;
        }

        .icon {
            width: var(--size);
            height: var(--size);
            display: block;
            background-color: var(--font-color);
            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: var(--size);
            mask-image: url('https://i.imgur.com/fJjGz7i.png');
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-size: var(--size);
            -webkit-mask-image: url('https://i.imgur.com/fJjGz7i.png');
        }

        .icon.twitch {
            background-color: #6441a5;
            mask-image: url('https://i.imgur.com/DnG97p5.png');
            -webkit-mask-image: url('https://i.imgur.com/DnG97p5.png');
        }

        .icon.facebook {
            background-color: #005FED;
            mask-image: url('https://i.imgur.com/t8pQUvH.png');
            -webkit-mask-image: url('https://i.imgur.com/t8pQUvH.png');
        }

        .icon.youtube {
            background-color: #f80231;
            mask-image: url('https://i.imgur.com/PCyzV61.png');
            -webkit-mask-image: url('https://i.imgur.com/PCyzV61.png');
        }

        .icon.kick {
            background-color: #00e701;
            mask-image: url('https://i.imgur.com/GONwTVy.png');
            -webkit-mask-image: url('https://i.imgur.com/GONwTVy.png');
        }

        .icon.tiktok {
            background-color: #2af0ea;
            mask-image: url('https://i.imgur.com/paZ8nLv.png');
            -webkit-mask-image: url('https://i.imgur.com/paZ8nLv.png');
        }

        .views {
            display: inline-block;
            overflow: hidden;
            letter-spacing: 2px;
            line-height: var(--size);
            font-family: var(--font-family);
            font-weight: var(--font-weight);
            font-size: calc(var(--size) * .85);
            color: #e8f2fa;
            text-align: center;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }
    </style>
</head>

<body>
    <main id="platform_container"></main>
    <template id="platform-template">
        <div class="platform">
            <span class="icon"></span>
            <span class="views"></span>
        </div>
    </template>
    <script type="text/javascript">
(() => {
    'use strict';

    // ==========================================
    // DOM
    // ==========================================

    const container =
        document.getElementById(
            'platform_container'
        );

    const template =
        document.getElementById(
            'platform-template'
        );

    const params =
        new URLSearchParams(
            window.location.search
        );

    // ==========================================
    // CONFIG
    // ==========================================

    const CONFIG = {

        session:
            params.get('session') || '',

        password:
            params.get('password') || 'false',

        lanOnly:
            params.has('lanonly'),

        debug:
            params.has('debug'),

        hasServerMode:
            params.has('server') ||
            params.has('server2') ||
            params.has('server3')
    };

    // ==========================================
    // CONSTANTS
    // ==========================================

    const KNOWN_PLATFORMS = [
        'youtube',
        'twitch',
        'kick',
        'facebook',
        'tiktok',
        'trovo'
    ];

    const PLATFORM_ORDER = {
        total: 0,
        twitch: 1,
        youtube: 2,
        kick: 3,
        facebook: 4,
        tiktok: 5,
        trovo: 6
    };

    // ==========================================
    // STATE
    // ==========================================

    const state =
        new Map();

    const elements =
        new Map();

    const sockets = [];

    const viewerCounts =
        Object.create(null);

    const activePlatforms =
        new Set();

    let iframe = null;

    let sequence = 0;

    let renderScheduled =
        false;

    // ==========================================
    // HELPERS
    // ==========================================

    function debug(...args) {

        if (!CONFIG.debug) {
            return;
        }

        console.log(
            '[Views Overlay]',
            ...args
        );
    }

    function parseNumber(value) {

        if (
            typeof value === 'number' &&
            Number.isFinite(value)
        ) {
            return value;
        }

        if (
            typeof value === 'string'
        ) {

            const cleaned =
                value.replace(
                    /[^0-9.-]/g,
                    ''
                );

            if (!cleaned) {
                return null;
            }

            const parsed =
                parseFloat(cleaned);

            return Number.isFinite(parsed)
                ? parsed
                : null;
        }

        return null;
    }

    function formatNumberShort(
        number,
        precision = 1
    ) {

        number = Number(number);

        if (
            !Number.isFinite(number)
        ) {
            return '0';
        }

        if (number < 1000) {
            return number.toString();
        }

        const suffixes =
            ['K', 'M', 'B', 'T'];

        const suffixIndex =
            Math.floor(
                Math.log10(number) / 3
            ) - 1;

        const shortValue =
            number /
            Math.pow(
                1000,
                suffixIndex + 1
            );

        return `${parseFloat(
            shortValue.toFixed(
                precision
            )
        )}${suffixes[suffixIndex]}`;
    }

    function normalizeEventName(
        eventName
    ) {

        if (
            typeof eventName !==
            'string'
        ) {
            return '';
        }

        return eventName
            .toLowerCase()
            .replace(
                /[^a-z0-9]+/g,
                '_'
            )
            .replace(
                /_+/g,
                '_'
            )
            .replace(
                /^_+|_+$/g,
                ''
            );
    }

    function isPlainObject(value) {

        return (
            Object.prototype.toString.call(
                value
            ) === '[object Object]'
        );
    }

    function extractViewerCount(
        data,
        meta
    ) {

        let count =
            parseNumber(meta);

        if (count !== null) {
            return count;
        }

        if (
            meta &&
            typeof meta === 'object'
        ) {

            count =
                parseNumber(
                    meta.viewers ??
                    meta.viewerCount ??
                    meta.viewer_count ??
                    meta.concurrentViewers ??
                    meta.participants ??
                    meta.audience ??
                    meta.watchers ??
                    meta.count
                );

            if (count !== null) {
                return count;
            }
        }

        count =
            parseNumber(
                data.viewers ??
                data.viewerCount ??
                data.viewer_count ??
                data.concurrentViewers ??
                data.watchers ??
                data.count
            );

        return count;
    }

    // ==========================================
    // PLATFORM
    // ==========================================

    function registerPlatform(
        platform
    ) {

        if (!platform) {
            return;
        }

        platform =
            platform.toLowerCase();

        if (
            !KNOWN_PLATFORMS.includes(
                platform
            )
        ) {
            return;
        }

        if (
            activePlatforms.has(
                platform
            )
        ) {
            return;
        }

        activePlatforms.add(
            platform
        );

        if (
            viewerCounts[
            platform
            ] === undefined
        ) {

            viewerCounts[
                platform
            ] = 0;
        }

        debug(
            'Platform registered:',
            platform
        );

        syncViewerEntries();
    }

    // ==========================================
    // ENTRY
    // ==========================================

    function setEntry({
        id,
        platform,
        value,
        label
    }) {

        if (!id) {
            return;
        }

        const existing =
            state.get(id);

        state.set(id, {

            id,

            platform,

            value,

            label,

            order:
                PLATFORM_ORDER[
                platform
                ] ?? 999,

            sequence:
                existing?.sequence ??
                ++sequence
        });
    }

    // ==========================================
    // VIEWERS
    // ==========================================

    function syncViewerEntries() {

        let total = 0;

        Object.entries(
            viewerCounts
        ).forEach(
            ([platform, count]) => {

                const numeric =
                    parseNumber(count);

                if (
                    numeric === null
                ) {
                    return;
                }

                total += numeric;

                setEntry({

                    id:
                        `viewer-${platform}`,

                    platform,

                    label:
                        `${platform.toUpperCase()} Viewers`,

                    value:
                        numeric
                });
            }
        );

        setEntry({

            id:
                'viewer-total',

            platform:
                'total',

            label:
                'Total Viewers',

            value:
                total
        });

        scheduleRender();
    }

    // ==========================================
    // RENDER
    // ==========================================

    function scheduleRender() {

        if (renderScheduled) {
            return;
        }

        renderScheduled = true;

        requestAnimationFrame(
            () => {

                renderScheduled =
                    false;

                render();
            }
        );
    }

    function createPlatformElement(
        entry
    ) {

        const fragment =
            template.content.cloneNode(
                true
            );

        const base =
            fragment.querySelector(
                '.platform'
            );

        const icon =
            fragment.querySelector(
                '.icon'
            );

        const views =
            fragment.querySelector(
                '.views'
            );

        base.dataset.platform =
            entry.platform;

        base.dataset.id =
            entry.id;

        base.classList.add(
            entry.platform
        );

        icon?.classList.add(
            entry.platform
        );

        views.dataset.value =
            entry.value;

        views.textContent =
            formatNumberShort(
                entry.value
            );

        container.appendChild(
            base
        );

        elements.set(
            entry.id,
            {
                base,
                views
            }
        );
    }

    function animateUpdate(
        element
    ) {

        element.classList.remove(
            'animate-pop'
        );

        void element.offsetWidth;

        element.classList.add(
            'animate-pop'
        );

        clearTimeout(
            element._animationTimeout
        );

        element._animationTimeout =
            setTimeout(() => {

                element.classList.remove(
                    'animate-pop'
                );

            }, 400);
    }

    function updatePlatformElement(
        entry
    ) {

        let element =
            elements.get(
                entry.id
            );

        if (!element) {

            createPlatformElement(
                entry
            );

            element =
                elements.get(
                    entry.id
                );
        }

        const currentValue =
            Number(
                element.views.dataset
                    .value
            );

        if (
            currentValue ===
            entry.value
        ) {
            return;
        }

        element.views.dataset.value =
            entry.value;

        element.views.textContent =
            formatNumberShort(
                entry.value
            );

        animateUpdate(
            element.views
        );
    }

    function render() {

        const entries =
            [...state.values()]
                .sort(
                    (a, b) => {

                        if (
                            a.order !==
                            b.order
                        ) {
                            return (
                                a.order -
                                b.order
                            );
                        }

                        return (
                            a.sequence -
                            b.sequence
                        );
                    }
                );

        entries.forEach(
            updatePlatformElement
        );
    }

    // ==========================================
    // PAYLOAD
    // ==========================================

    function processPayload(data) {

        if (
            !data ||
            typeof data !==
            'object'
        ) {
            return;
        }

        if (
            data.content &&
            typeof data.content ===
            'object'
        ) {

            data =
                data.content;
        }

        const platform =
            (
                data.platform ||
                data.type ||
                data.event ||
                ''
            )
                .toString()
                .toLowerCase();

        const eventName =
            normalizeEventName(
                data.event ||
                data.type ||
                ''
            );

        const meta =
            data.meta;

        debug(
            'Payload:',
            {
                platform,
                eventName,
                data
            }
        );

        // ==========================================
        // REGISTER PLATFORM
        // ==========================================

        if (
            KNOWN_PLATFORMS.includes(
                platform
            )
        ) {

            registerPlatform(
                platform
            );
        }

        // ==========================================
        // MULTI VIEWERS
        // ==========================================

        if (
            eventName ===
            'viewer_updates'
        ) {

            if (
                !isPlainObject(meta)
            ) {
                return;
            }

            let changed =
                false;

            Object.entries(meta)
                .forEach(
                    ([platform, value]) => {

                        platform =
                            platform.toLowerCase();

                        registerPlatform(
                            platform
                        );

                        const count =
                            parseNumber(
                                value
                            );

                        if (
                            count === null
                        ) {
                            return;
                        }

                        if (
                            viewerCounts[
                            platform
                            ] === count
                        ) {
                            return;
                        }

                        viewerCounts[
                            platform
                            ] = count;

                        changed = true;
                    }
                );

            if (changed) {
                syncViewerEntries();
            }

            return;
        }

        // ==========================================
        // SINGLE PLATFORM
        // ==========================================

        if (
            !KNOWN_PLATFORMS.includes(
                platform
            )
        ) {
            return;
        }

        const count =
            extractViewerCount(
                data,
                meta
            );

        // plataforma ativa
        // mas offline
        if (
            count === null
        ) {

            if (
                viewerCounts[
                platform
                ] === undefined
            ) {

                viewerCounts[
                    platform
                ] = 0;

                syncViewerEntries();
            }

            return;
        }

        if (
            viewerCounts[
            platform
            ] === count
        ) {
            return;
        }

        viewerCounts[
            platform
        ] = count;

        syncViewerEntries();
    }

    // ==========================================
    // INCOMING DATA
    // ==========================================

    function processIncomingData(
        raw
    ) {

        if (
            !raw ||
            typeof raw !==
            'object'
        ) {
            return;
        }

        const possiblePayloads = [

            raw,

            raw.overlayNinja,

            raw.dataReceived,

            raw.dataReceived?.overlayNinja,

            raw.message,

            raw.payload,

            raw.data
        ];

        possiblePayloads.forEach(
            payload => {

                if (
                    payload &&
                    typeof payload ===
                    'object'
                ) {

                    processPayload(
                        payload
                    );
                }
            }
        );
    }

    // ==========================================
    // IFRAME
    // ==========================================

    function connectIframe() {

        if (
            !CONFIG.session ||
            CONFIG.hasServerMode
        ) {
            return;
        }

        const password =
            encodeURIComponent(
                CONFIG.password
            );

        const lanOnly =
            CONFIG.lanOnly
                ? '&lanonly'
                : '';

        iframe =
            document.createElement(
                'iframe'
            );

        iframe.src =
            `https://vdo.socialstream.ninja/?clearstorage&ln&salt=vdo.ninja&notmobile&password=${password + lanOnly}&solo&view=${encodeURIComponent(CONFIG.session)}&novideo&noaudio&label=meta&cleanoutput&room=${encodeURIComponent(CONFIG.session)}`;

        iframe.style.cssText = `
            width:0;
            height:0;
            position:fixed;
            left:-9999px;
            top:-9999px;
            border:0;
            pointer-events:none;
        `;

        document.body.appendChild(
            iframe
        );

        debug(
            'Iframe connected'
        );
    }

    // ==========================================
    // SOCKET
    // ==========================================

    function connectSocket({
        url,
        roomId,
        out,
        inChannel
    }) {

        if (
            !url ||
            !roomId
        ) {
            return;
        }

        const connection = {

            socket:
                null,

            timer:
                null,

            attempts:
                1,

            closed:
                false
        };

        sockets.push(
            connection
        );

        function reconnect() {

            if (
                connection.closed
            ) {
                return;
            }

            clearTimeout(
                connection.timer
            );

            const delay =
                Math.min(
                    15000,
                    1000 *
                    connection.attempts
                );

            connection.timer =
                setTimeout(
                    connect,
                    delay
                );

            connection.attempts++;
        }

        function connect() {

            if (
                connection.closed
            ) {
                return;
            }

            try {

                connection.socket =
                    new WebSocket(
                        url
                    );

            } catch {

                reconnect();
                return;
            }

            connection.socket.onopen =
                () => {

                    connection.attempts =
                        1;

                    connection.socket.send(
                        JSON.stringify({

                            join:
                                roomId,

                            out,

                            in:
                                inChannel
                        })
                    );
                };

            connection.socket.onmessage =
                event => {

                    if (
                        !event?.data
                    ) {
                        return;
                    }

                    try {

                        const parsed =
                            JSON.parse(
                                event.data
                            );

                        processIncomingData(
                            parsed
                        );

                        if (
                            parsed?.get
                        ) {

                            connection.socket.send(
                                JSON.stringify({
                                    callback: {
                                        get:
                                            parsed.get,
                                        result:
                                            true
                                    }
                                })
                            );
                        }

                    } catch (
                        error
                    ) {

                        debug(
                            'Socket parse error:',
                            error
                        );
                    }
                };

            connection.socket.onerror =
                () => {

                    try {

                        connection.socket.close();

                    } catch { }
                };

            connection.socket.onclose =
                reconnect;
        }

        connect();
    }

    // ==========================================
    // SERVER MODES
    // ==========================================

    function connectServerModes() {

        const roomId =
            CONFIG.session
                .split(',')[0];

        if (!roomId) {
            return;
        }

        // API SERVER

        if (
            params.has(
                'server'
            )
        ) {

            const url =
                params.get(
                    'server'
                ) ||
                (
                    params.has(
                        'localserver'
                    )
                        ? 'ws://127.0.0.1:3000'
                        : 'wss://io.socialstream.ninja/api'
                );

            connectSocket({

                url,

                roomId,

                out: 2,

                inChannel: 1
            });
        }

        // EXTENSION SERVER

        if (
            params.has(
                'server2'
            ) ||
            params.has(
                'server3'
            )
        ) {

            const url =
                params.has(
                    'server2'
                )
                    ? (
                        params.get(
                            'server2'
                        ) ||
                        'wss://io.socialstream.ninja/extension'
                    )
                    : (
                        params.get(
                            'server3'
                        ) ||
                        'wss://io.socialstream.ninja/extension'
                    );

            connectSocket({

                url,

                roomId,

                out: 3,

                inChannel: 4
            });
        }
    }

    // ==========================================
    // MESSAGE LISTENER
    // ==========================================

    window.addEventListener(
        'message',
        event => {

            let payload =
                null;

            if (
                event?.data
                    ?.dataReceived
                    ?.overlayNinja
            ) {

                if (
                    iframe &&
                    event.source !==
                    iframe.contentWindow
                ) {
                    return;
                }

                payload =
                    event.data
                        .dataReceived
                        .overlayNinja;
            }

            else if (
                event?.data
                    ?.overlayNinja
            ) {

                payload =
                    event.data
                        .overlayNinja;
            }

            if (payload) {

                processIncomingData(
                    payload
                );
            }
        }
    );

    // ==========================================
    // CLEANUP
    // ==========================================

    window.addEventListener(
        'beforeunload',
        () => {

            sockets.forEach(
                connection => {

                    connection.closed =
                        true;

                    clearTimeout(
                        connection.timer
                    );

                    if (
                        connection.socket
                    ) {

                        try {

                            connection.socket.onclose =
                                null;

                            connection.socket.close();

                        } catch { }
                    }
                }
            );
        }
    );

    // ==========================================
    // INIT
    // ==========================================

    // KNOWN_PLATFORMS.forEach(
    //     platform => {

    //         registerPlatform(
    //             platform
    //         );
    //     }
    // );

    syncViewerEntries();

    render();

    connectServerModes();

    connectIframe();

})();
    </script>
</body>

</html>
