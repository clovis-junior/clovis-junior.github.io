<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Views Overlay - Social Stream Ninja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        type="text/css">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style type="text/css">
        @keyframes pop {

            0%,
            100% {
                transform: inherit;
            }

            50% {
                transform: scale(1.1);
            }
        }

        *,
        *:after,
        *:before {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        * {
            outline: 0;
            border: none;
            font-family: inherit;
            font-size: 100%;
            background: transparent;
            vertical-align: baseline
        }

        :root {
            --font-family: 'Noto Sans';
            --font-weight: 900;
            --font-color: #e8f2fa;
            --size: 56px;
        }

        body {
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        #platform_container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            transition: filter 180ms ease;
            -webkit-mask-image: linear-gradient(180deg, white 20%, white 80%, transparent 100%);
            mask-image: linear-gradient(180deg, white 20%, white 80%, transparent 100%);
        }

        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .platform {
            flex: 1 0;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            overflow: hidden;
            user-select: none;
            animation-name: fadeIn;
            animation-duration: 360ms;
            animation-timing-function: linear;
            animation-fill-mode: backwards;
        }

        .icon {
            width: var(--size);
            height: var(--size);
            display: block;
            background-color: var(--font-color);
            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: var(--size);
            mask-image: url('https://i.imgur.com/fJjGz7i.png');
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-size: var(--size);
            -webkit-mask-image: url('https://i.imgur.com/fJjGz7i.png');
        }

        .icon.twitch {
            background-color: #6441a5;
            mask-image: url('https://i.imgur.com/DnG97p5.png');
            -webkit-mask-image: url('https://i.imgur.com/DnG97p5.png');
        }

        .icon.facebook {
            background-color: #005FED;
            mask-image: url('https://i.imgur.com/t8pQUvH.png');
            -webkit-mask-image: url('https://i.imgur.com/t8pQUvH.png');
        }

        .icon.youtube {
            background-color: #f80231;
            mask-image: url('https://i.imgur.com/PCyzV61.png');
            -webkit-mask-image: url('https://i.imgur.com/PCyzV61.png');
        }

        .icon.kick {
            background-color: #00e701;
            mask-image: url('https://i.imgur.com/GONwTVy.png');
            -webkit-mask-image: url('https://i.imgur.com/GONwTVy.png');
        }

        .icon.tiktok {
            background-color: #2af0ea;
            mask-image: url('https://i.imgur.com/paZ8nLv.png');
            -webkit-mask-image: url('https://i.imgur.com/paZ8nLv.png');
        }

        .views {
            display: inline-block;
            overflow: hidden;
            letter-spacing: 2px;
            line-height: var(--size);
            font-family: var(--font-family);
            font-weight: var(--font-weight);
            font-size: calc(var(--size) * .85);
            color: #e8f2fa;
            text-align: center;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }
    </style>
</head>

<body>
    <main id="platform_container"></main>
    <template id="platform-template">
        <div class="platform">
            <span class="icon"></span>
            <span class="views"></span>
        </div>
    </template>
    <script type="text/javascript">
        (() => {
            'use strict';

            /*
             * ================================================================
             * SOCIAL STREAM NINJA - VIEWERS OVERLAY
             * ================================================================
             *
             * Responsabilidades:
             *
             * 1. Conectar ao Social Stream Ninja.
             * 2. Receber viewer_update / viewer_updates.
             * 3. Detectar plataformas automaticamente.
             * 4. Manter contagens por plataforma.
             * 5. Renderizar total + plataformas.
             * 6. Reconectar WebSockets.
             * 7. Fornecer logs úteis em modo debug.
             *
             * Transportes:
             *
             * - VDO.Ninja / iframe
             * - Social Stream Ninja API WebSocket
             * - Social Stream Ninja Extension WebSocket
             *
             * Exemplos:
             *
             * ?session=ABC123
             * ?session=ABC123&platforms=youtube,twitch,kick
             * ?session=ABC123&hidetotal
             * ?session=ABC123&debug
             *
             * WebSocket:
             *
             * ?session=ABC123&server
             * ?session=ABC123&server2
             * ?session=ABC123&server3
             *
             * ================================================================
             */

            // ================================================================
            // DOM
            // ================================================================

            const container =
                document.getElementById('platform_container');

            const template =
                document.getElementById('platform-template');

            if (!container) {
                console.error(
                    '[VIEWERS][ERROR] #platform_container não encontrado.'
                );

                return;
            }

            if (!template) {
                console.error(
                    '[VIEWERS][ERROR] #platform-template não encontrado.'
                );

                return;
            }

            // ================================================================
            // URL PARAMETERS
            // ================================================================

            /*
             * IMPORTANTE:
             *
             * Não usamos .toLowerCase() em window.location.search.
             *
             * O session pode ser case-sensitive.
             *
             * A normalização é feita individualmente quando necessária.
             */
            const params =
                new URLSearchParams(
                    window.location.search
                );

            // ================================================================
            // LOGGING
            // ================================================================

            const DEBUG =
                params.has('debug');

            const LOG_PREFIX =
                '[VIEWERS]';

            function log(...args) {
                console.log(
                    LOG_PREFIX,
                    ...args
                );
            }

            function debug(...args) {
                if (!DEBUG) {
                    return;
                }

                console.debug(
                    `${LOG_PREFIX}[DEBUG]`,
                    ...args
                );
            }

            function success(...args) {
                console.log(
                    `${LOG_PREFIX}[OK]`,
                    ...args
                );
            }

            function warn(...args) {
                console.warn(
                    `${LOG_PREFIX}[WARN]`,
                    ...args
                );
            }

            function error(...args) {
                console.error(
                    `${LOG_PREFIX}[ERROR]`,
                    ...args
                );
            }

            // ================================================================
            // CONFIGURATION
            // ================================================================

            const CONFIG = {
                session:
                    params.get('session') || '',

                password:
                    params.get('password') || 'false',

                lanOnly:
                    params.has('lanonly'),

                hideTotal:
                    params.has('hidetotal'),

                debug:
                    DEBUG,

                hasServerMode:
                    params.has('server') ||
                    params.has('server2') ||
                    params.has('server3')
            };

            /*
             * Plataformas explicitamente definidas através de ?platforms=.
             *
             * Elas nunca são removidas por um viewer_updates.
             *
             * Exemplo:
             *
             * ?platforms=youtube,twitch,kick,facebook,tiktok
             *
             * Mesmo que o SSN envie somente:
             *
             * { kick: 1, twitch: 0 }
             *
             * o resultado será:
             *
             * youtube  = 0
             * twitch   = 0
             * kick     = 1
             * facebook = 0
             * tiktok   = 0
             */
            const configuredPlatforms = [];

            const configuredPlatformSet =
                new Set();

            // ================================================================
            // STATE
            // ================================================================

            /*
             * Ordem das plataformas exibidas.
             *
             * Plataformas definidas pela URL entram primeiro.
             * Plataformas descobertas automaticamente entram depois.
             */
            const registeredPlatforms = [];

            const registeredPlatformSet =
                new Set();

            /*
             * Contagem atual por plataforma.
             *
             * Exemplo:
             *
             * {
             *     youtube: 1200,
             *     twitch: 350,
             *     kick: 42
             * }
             */
            const viewerCounts =
                Object.create(null);

            /*
             * Entradas renderizadas.
             */
            const entries =
                new Map();

            /*
             * Elementos DOM.
             */
            const elements =
                new Map();

            /*
             * Conexões WebSocket.
             */
            const sockets = [];

            /*
             * Iframe VDO.Ninja.
             */
            let iframe = null;

            /*
             * Ordem de criação das entradas.
             */
            let sequence = 0;

            /*
             * Última ordem aplicada ao DOM.
             */
            let renderedOrder = '';

            // ================================================================
            // HELPERS
            // ================================================================

            function isPlainObject(value) {
                return (
                    Object.prototype.toString.call(value) ===
                    '[object Object]'
                );
            }

            function parseNumber(value) {
                if (
                    typeof value === 'number' &&
                    Number.isFinite(value)
                ) {
                    return value;
                }

                if (
                    typeof value !== 'string'
                ) {
                    return null;
                }

                const cleaned =
                    value.replace(
                        /[^0-9.-]/g,
                        ''
                    );

                if (!cleaned) {
                    return null;
                }

                const parsed =
                    Number(cleaned);

                return Number.isFinite(parsed)
                    ? parsed
                    : null;
            }

            function formatNumberShort(
                value,
                precision = 1
            ) {
                const number =
                    Number(value);

                if (!Number.isFinite(number)) {
                    return '0';
                }

                if (number < 1000) {
                    return number.toString();
                }

                const suffixes = [
                    'K',
                    'M',
                    'B',
                    'T'
                ];

                const suffixIndex =
                    Math.floor(
                        Math.log10(number) / 3
                    ) - 1;

                const safeIndex =
                    Math.min(
                        suffixIndex,
                        suffixes.length - 1
                    );

                const divisor =
                    1000 ** (
                        safeIndex + 1
                    );

                const shortValue =
                    number / divisor;

                return (
                    `${parseFloat(
                        shortValue.toFixed(
                            precision
                        )
                    )}${suffixes[safeIndex]}`
                );
            }

            function normalizeEventName(
                eventName
            ) {
                if (
                    typeof eventName !== 'string'
                ) {
                    return '';
                }

                return eventName
                    .toLowerCase()
                    .replace(
                        /[^a-z0-9]+/g,
                        '_'
                    )
                    .replace(
                        /_+/g,
                        '_'
                    )
                    .replace(
                        /^_+|_+$/g,
                        ''
                    );
            }

            // ================================================================
            // PLATFORM NORMALIZATION
            // ================================================================

            function normalizePlatformName(
                platform
            ) {
                if (
                    platform === null ||
                    platform === undefined
                ) {
                    return '';
                }

                const original =
                    String(platform);

                const normalized =
                    original
                        .toLowerCase()
                        .trim();

                if (!normalized) {
                    return '';
                }

                // ------------------------------------------------------------
                // YouTube
                // ------------------------------------------------------------

                if (
                    normalized.includes('youtube') ||
                    normalized === 'yt' ||
                    normalized.includes('youtubegaming')
                ) {
                    return 'youtube';
                }

                // ------------------------------------------------------------
                // Twitch
                // ------------------------------------------------------------

                if (
                    normalized.includes('twitch')
                ) {
                    return 'twitch';
                }

                // ------------------------------------------------------------
                // Kick
                // ------------------------------------------------------------

                if (
                    normalized === 'kick' ||
                    normalized.includes('kick.com') ||
                    normalized.includes('kick streaming')
                ) {
                    return 'kick';
                }

                // ------------------------------------------------------------
                // Facebook
                // ------------------------------------------------------------

                if (
                    normalized.includes('facebook') ||
                    normalized === 'fb'
                ) {
                    return 'facebook';
                }

                // ------------------------------------------------------------
                // TikTok
                // ------------------------------------------------------------

                if (
                    normalized.includes('tiktok') ||
                    normalized.includes('tik_tok')
                ) {
                    return 'tiktok';
                }

                // ------------------------------------------------------------
                // Fallback
                // ------------------------------------------------------------

                const fallback =
                    normalized.replace(
                        /[^a-z0-9]/g,
                        ''
                    );

                if (
                    fallback &&
                    DEBUG
                ) {
                    debug(
                        'Plataforma não mapeada:',
                        {
                            original,
                            normalized,
                            fallback
                        }
                    );
                }

                return fallback;
            }

            // ================================================================
            // PLATFORM REGISTRATION
            // ================================================================

            function registerPlatform(
                platform,
                {
                    configured = false
                } = {}
            ) {
                const normalized =
                    normalizePlatformName(
                        platform
                    );

                if (!normalized) {
                    return false;
                }

                /*
                 * Plataformas configuradas pela URL
                 * também entram no registro normal.
                 */
                if (configured) {
                    if (
                        !configuredPlatformSet.has(
                            normalized
                        )
                    ) {
                        configuredPlatformSet.add(
                            normalized
                        );

                        configuredPlatforms.push(
                            normalized
                        );
                    }
                }

                if (
                    registeredPlatformSet.has(
                        normalized
                    )
                ) {
                    return false;
                }

                registeredPlatformSet.add(
                    normalized
                );

                registeredPlatforms.push(
                    normalized
                );

                if (
                    viewerCounts[normalized] ===
                    undefined
                ) {
                    viewerCounts[normalized] = 0;
                }

                log(
                    'Nova plataforma registrada:',
                    normalized
                );

                debug(
                    'Plataformas atuais:',
                    [...registeredPlatforms]
                );

                return true;
            }

            // ================================================================
            // INITIAL PLATFORMS
            // ================================================================

            function registerInitialPlatforms() {
                const raw =
                    params.get('platforms');

                if (!raw) {
                    debug(
                        'Nenhuma plataforma definida por ?platforms.'
                    );

                    return;
                }

                raw
                    .split(',')
                    .map(
                        platform =>
                            normalizePlatformName(
                                platform
                            )
                    )
                    .filter(Boolean)
                    .forEach(
                        platform =>
                            registerPlatform(
                                platform,
                                {
                                    configured: true
                                }
                            )
                    );

                log(
                    'Plataformas definidas pela URL:',
                    [...configuredPlatforms]
                );
            }

            // ================================================================
            // PLATFORM DISCOVERY
            // ================================================================

            function registerPlatformsFromPayload(
                data
            ) {
                if (!data) {
                    return;
                }

                const candidates = [];

                // ------------------------------------------------------------
                // Top level
                // ------------------------------------------------------------

                candidates.push(
                    data.platform
                );

                /*
                 * data.type normalmente representa
                 * a plataforma em viewer_update.
                 */
                candidates.push(
                    data.type
                );

                // ------------------------------------------------------------
                // viewer_updates
                // ------------------------------------------------------------

                if (
                    isPlainObject(data.meta)
                ) {
                    Object.keys(
                        data.meta
                    ).forEach(
                        platform =>
                            candidates.push(
                                platform
                            )
                    );
                }

                // ------------------------------------------------------------
                // Optional source arrays
                // ------------------------------------------------------------

                const sourceArrays = [
                    data.sources,
                    data.accounts,
                    data.channels,
                    data.destinations
                ];

                sourceArrays.forEach(
                    source => {

                        if (
                            !Array.isArray(source)
                        ) {
                            return;
                        }

                        source.forEach(
                            item => {

                                if (
                                    typeof item ===
                                    'string'
                                ) {
                                    candidates.push(
                                        item
                                    );

                                    return;
                                }

                                if (
                                    item &&
                                    typeof item ===
                                    'object'
                                ) {
                                    candidates.push(
                                        item.type,
                                        item.platform,
                                        item.name
                                    );
                                }
                            }
                        );
                    }
                );

                candidates
                    .filter(Boolean)
                    .forEach(
                        registerPlatform
                    );
            }

            // ================================================================
            // ENTRY STATE
            // ================================================================

            function setEntry({
                id,
                platform,
                value,
                label,
                order
            }) {
                if (!id) {
                    return;
                }

                const existing =
                    entries.get(id);

                if (existing) {
                    existing.platform = platform;
                    existing.value = value;
                    existing.label = label;
                    existing.order = order;

                    return;
                }

                entries.set(
                    id,
                    {
                        id,
                        platform,
                        value,
                        label,
                        order,
                        sequence: ++sequence
                    }
                );

                debug(
                    'Nova entrada:',
                    id
                );
            }

            // ================================================================
            // DOM CREATION
            // ================================================================

            function createPlatformElement(
                entry
            ) {
                const fragment =
                    template.content.cloneNode(
                        true
                    );

                const base =
                    fragment.querySelector(
                        '.platform'
                    );

                const icon =
                    fragment.querySelector(
                        '.icon'
                    );

                const views =
                    fragment.querySelector(
                        '.views'
                    );

                if (
                    !base ||
                    !views
                ) {
                    error(
                        'Template inválido. .platform ou .views não encontrados.'
                    );

                    return null;
                }

                base.dataset.id =
                    entry.id;

                base.dataset.platform =
                    entry.platform;

                base.classList.add(
                    entry.platform
                );

                if (icon) {
                    icon.classList.add(
                        entry.platform
                    );
                }

                views.dataset.value =
                    String(entry.value);

                views.textContent =
                    formatNumberShort(
                        entry.value
                    );

                container.appendChild(
                    base
                );

                const element = {
                    base,
                    views
                };

                elements.set(
                    entry.id,
                    element
                );

                debug(
                    'Elemento criado:',
                    entry.id,
                    entry.platform
                );

                return element;
            }

            // ================================================================
            // DOM UPDATE
            // ================================================================

            function updatePlatformElement(
                entry
            ) {
                let element =
                    elements.get(
                        entry.id
                    );

                if (!element) {
                    element =
                        createPlatformElement(
                            entry
                        );

                    return;
                }

                const currentValue =
                    Number(
                        element.views.dataset.value
                    );

                if (
                    currentValue ===
                    entry.value
                ) {
                    return;
                }

                element.views.dataset.value =
                    String(entry.value);

                element.views.textContent =
                    formatNumberShort(
                        entry.value
                    );

                animateUpdate(
                    element.views
                );

                debug(
                    'Contagem atualizada:',
                    entry.platform,
                    currentValue,
                    '→',
                    entry.value
                );
            }

            // ================================================================
            // ANIMATION
            // ================================================================

            function animateUpdate(
                element
            ) {
                if (!element) {
                    return;
                }

                element.classList.remove(
                    'animate-pop'
                );

                /*
                 * Força o browser a reconhecer
                 * a remoção da classe antes de
                 * adicioná-la novamente.
                 */
                void element.offsetWidth;

                element.classList.add(
                    'animate-pop'
                );

                clearTimeout(
                    element._animationTimer
                );

                element._animationTimer =
                    setTimeout(
                        () => {
                            element.classList.remove(
                                'animate-pop'
                            );
                        },
                        400
                    );
            }

            // ================================================================
            // RENDER
            // ================================================================

            function render() {
                const orderedEntries =
                    [...entries.values()]
                        .sort(
                            (a, b) => {

                                if (
                                    a.order !==
                                    b.order
                                ) {
                                    return (
                                        a.order -
                                        b.order
                                    );
                                }

                                return (
                                    a.sequence -
                                    b.sequence
                                );
                            }
                        );

                /*
                 * Primeiro atualizamos os valores.
                 */
                orderedEntries.forEach(
                    updatePlatformElement
                );

                /*
                 * Depois verificamos se a ordem
                 * realmente mudou.
                 */
                const nextOrder =
                    orderedEntries
                        .map(
                            entry =>
                                entry.id
                        )
                        .join('|');

                if (
                    nextOrder ===
                    renderedOrder
                ) {
                    return;
                }

                renderedOrder =
                    nextOrder;

                /*
                 * Reordena somente quando necessário.
                 */
                orderedEntries.forEach(
                    (
                        entry,
                        index
                    ) => {

                        const element =
                            elements.get(
                                entry.id
                            );

                        if (
                            !element?.base
                        ) {
                            return;
                        }

                        const current =
                            container.children[
                            index
                            ];

                        if (
                            current ===
                            element.base
                        ) {
                            return;
                        }

                        container.insertBefore(
                            element.base,
                            current || null
                        );
                    }
                );

                debug(
                    'DOM reorganizado:',
                    nextOrder
                );
            }

            // ================================================================
            // VIEWER STATE
            // ================================================================

            function syncViewerEntries() {
                let total = 0;

                // ------------------------------------------------------------
                // Total
                // ------------------------------------------------------------

                if (
                    !CONFIG.hideTotal
                ) {
                    setEntry(
                        {
                            id: 'viewer-total',

                            platform: 'total',

                            label: 'Total Viewers',

                            value: 0,

                            order: 0
                        }
                    );
                }

                // ------------------------------------------------------------
                // Platforms
                // ------------------------------------------------------------

                registeredPlatforms.forEach(
                    (
                        platform,
                        index
                    ) => {

                        const count =
                            parseNumber(
                                viewerCounts[
                                platform
                                ]
                            ) ?? 0;

                        total += count;

                        setEntry(
                            {
                                id:
                                    `viewer-${platform}`,

                                platform,

                                label:
                                    `${platform.toUpperCase()} Viewers`,

                                value:
                                    count,

                                order:
                                    index + 1
                            }
                        );
                    }
                );

                // ------------------------------------------------------------
                // Total value
                // ------------------------------------------------------------

                if (
                    !CONFIG.hideTotal
                ) {
                    const totalEntry =
                        entries.get(
                            'viewer-total'
                        );

                    if (totalEntry) {
                        totalEntry.value =
                            total;
                    }
                }

                debug(
                    'Viewer state:',
                    {
                        total,
                        platforms: {
                            ...viewerCounts
                        }
                    }
                );

                render();
            }

            // ================================================================
            // SINGLE VIEWER UPDATE
            // ================================================================

            function processSingleViewerUpdate(
                data
            ) {
                /*
                 * Formato esperado:
                 *
                 * {
                 *     event: 'viewer_update',
                 *     type: 'kick',
                 *     meta: 3
                 * }
                 *
                 * ou:
                 *
                 * {
                 *     event: 'viewer_update',
                 *     platform: 'kick',
                 *     meta: 3
                 * }
                 */

                const platform =
                    normalizePlatformName(
                        data.platform ||
                        data.type ||
                        ''
                    );

                const count =
                    parseNumber(
                        data.meta
                    );

                if (!platform) {
                    warn(
                        'viewer_update recebido sem plataforma:',
                        data
                    );

                    return;
                }

                if (
                    count === null
                ) {
                    warn(
                        'viewer_update recebido com contagem inválida:',
                        data
                    );

                    return;
                }

                registerPlatform(
                    platform
                );

                viewerCounts[
                    platform
                ] = count;

                log(
                    'Viewer update:',
                    platform,
                    '=',
                    count
                );

                syncViewerEntries();
            }

            // ================================================================
            // VIEWER SNAPSHOT
            // ================================================================

            function processViewerUpdates(
                data
            ) {
                if (
                    !isPlainObject(data.meta)
                ) {
                    warn(
                        'viewer_updates recebido sem meta válido:',
                        data
                    );

                    return;
                }

                /*
                 * viewer_updates representa um snapshot.
                 *
                 * Porém:
                 *
                 * - plataformas definidas por ?platforms=
                 *   NÃO podem desaparecer;
                 *
                 * - plataformas já descobertas também continuam
                 *   registradas e passam para 0 caso não estejam
                 *   no snapshot atual.
                 *
                 * Assim evitamos o problema de:
                 *
                 * ?platforms=youtube,twitch,kick,facebook,tiktok
                 *
                 * receber:
                 *
                 * { kick: 1, twitch: 0 }
                 *
                 * e apagar YouTube/Facebook/TikTok.
                 */

                registeredPlatforms.forEach(
                    platform => {
                        viewerCounts[
                            platform
                        ] = 0;
                    }
                );

                const snapshot =
                    Object.create(null);

                Object.entries(
                    data.meta
                ).forEach(
                    (
                        [
                            rawPlatform,
                            rawValue
                        ]
                    ) => {

                        const platform =
                            normalizePlatformName(
                                rawPlatform
                            );

                        const count =
                            parseNumber(
                                rawValue
                            );

                        if (!platform) {
                            warn(
                                'Plataforma inválida em viewer_updates:',
                                rawPlatform
                            );

                            return;
                        }

                        if (
                            count === null
                        ) {
                            warn(
                                'Contagem inválida:',
                                rawPlatform,
                                rawValue
                            );

                            return;
                        }

                        registerPlatform(
                            platform
                        );

                        viewerCounts[
                            platform
                        ] = count;

                        snapshot[
                            platform
                        ] = count;
                    }
                );

                log(
                    'Viewer snapshot recebido:',
                    snapshot
                );

                syncViewerEntries();
            }

            // ================================================================
            // PAYLOAD PROCESSING
            // ================================================================

            function processPayload(
                payload
            ) {
                if (
                    !payload ||
                    typeof payload !== 'object'
                ) {
                    warn(
                        'Payload ignorado: não é um objeto.',
                        payload
                    );

                    return;
                }

                /*
                 * Alguns transportes encapsulam o payload
                 * dentro de content.
                 */
                let data =
                    payload;

                if (
                    data.content &&
                    typeof data.content ===
                    'object'
                ) {
                    data =
                        data.content;
                }

                /*
                 * Descoberta de plataformas.
                 */
                registerPlatformsFromPayload(
                    data
                );

                /*
                 * IMPORTANTE:
                 *
                 * O evento vem de data.event.
                 *
                 * data.type normalmente é a plataforma.
                 */
                const eventName =
                    normalizeEventName(
                        data.event
                    );

                debug(
                    'Payload recebido:',
                    {
                        event: data.event,
                        normalizedEvent: eventName,
                        type: data.type,
                        platform: data.platform,
                        meta: data.meta
                    }
                );

                switch (
                eventName
                ) {
                    case 'viewer_update':
                        processSingleViewerUpdate(
                            data
                        );
                        break;

                    case 'viewer_updates':
                        processViewerUpdates(
                            data
                        );
                        break;

                    default:
                        debug(
                            'Evento ignorado pelo contador:',
                            eventName || '(sem evento)'
                        );
                }
            }

            // ================================================================
            // INCOMING DATA
            // ================================================================

            function processIncomingData(
                raw
            ) {
                if (!raw) {
                    return;
                }

                /*
                 * Formato principal:
                 *
                 * {
                 *     dataReceived: {
                 *         overlayNinja: {...}
                 *     }
                 * }
                 */
                if (
                    raw.dataReceived?.overlayNinja
                ) {
                    debug(
                        'Payload recebido via dataReceived.overlayNinja.'
                    );

                    processPayload(
                        raw.dataReceived.overlayNinja
                    );

                    return;
                }

                /*
                 * Formato alternativo:
                 *
                 * {
                 *     overlayNinja: {...}
                 * }
                 */
                if (
                    raw.overlayNinja
                ) {
                    debug(
                        'Payload recebido via overlayNinja.'
                    );

                    processPayload(
                        raw.overlayNinja
                    );

                    return;
                }

                /*
                 * Payload já está no formato SSN.
                 */
                if (
                    raw.event
                ) {
                    debug(
                        'Payload recebido diretamente.'
                    );

                    processPayload(
                        raw
                    );

                    return;
                }

                debug(
                    'Mensagem recebida sem payload SSN reconhecido:',
                    raw
                );
            }

            // ================================================================
            // IFRAME TRANSPORT
            // ================================================================

            function connectIframe() {
                if (
                    !CONFIG.session
                ) {
                    warn(
                        'Nenhuma session definida. Iframe não será conectado.'
                    );

                    return;
                }

                /*
                 * Se um WebSocket foi solicitado,
                 * não usamos o iframe para evitar
                 * receber o mesmo evento duas vezes.
                 */
                if (
                    CONFIG.hasServerMode
                ) {
                    debug(
                        'Modo WebSocket ativo. Iframe desabilitado.'
                    );

                    return;
                }

                const password =
                    encodeURIComponent(
                        CONFIG.password
                    );

                const lanOnly =
                    CONFIG.lanOnly
                        ? '&lanonly'
                        : '';

                const room =
                    encodeURIComponent(
                        CONFIG.session
                    );

                iframe =
                    document.createElement(
                        'iframe'
                    );

                iframe.src =
                    `https://vdo.socialstream.ninja/?ln` +
                    `&salt=vdo.ninja` +
                    `&notmobile` +
                    `&password=${password}` +
                    `${lanOnly}` +
                    `&solo` +
                    `&view=${room}` +
                    `&novideo` +
                    `&noaudio` +
                    `&label=meta` +
                    `&cleanoutput` +
                    `&room=${room}`;

                iframe.style.cssText = `
            width: 0;
            height: 0;
            position: fixed;
            left: -100px;
            top: -100px;
            border: 0;
            pointer-events: none;
        `;

                document.body.appendChild(
                    iframe
                );

                success(
                    'Iframe VDO.Ninja conectado.',
                    {
                        session:
                            CONFIG.session
                    }
                );
            }

            // ================================================================
            // WEBSOCKET TRANSPORT
            // ================================================================

            function connectSocket({
                url,
                roomId,
                out,
                inChannel,
                name
            }) {
                if (
                    !url ||
                    !roomId
                ) {
                    warn(
                        'WebSocket não iniciado: URL ou room ausente.',
                        {
                            url,
                            roomId,
                            name
                        }
                    );

                    return;
                }

                const connection = {
                    name:
                        name || 'websocket',

                    url,

                    socket:
                        null,

                    timer:
                        null,

                    attempts:
                        0,

                    closed:
                        false
                };

                sockets.push(
                    connection
                );

                function scheduleReconnect() {
                    if (
                        connection.closed
                    ) {
                        return;
                    }

                    clearTimeout(
                        connection.timer
                    );

                    connection.attempts++;

                    /*
                     * Backoff simples:
                     *
                     * 500ms
                     * 1000ms
                     * 1500ms
                     * ...
                     * máximo 12s
                     */
                    const delay =
                        Math.min(
                            12000,
                            500 *
                            connection.attempts
                        );

                    warn(
                        `${connection.name}: reconectando em ${delay}ms.`
                    );

                    connection.timer =
                        setTimeout(
                            connect,
                            delay
                        );
                }

                function connect() {
                    if (
                        connection.closed
                    ) {
                        return;
                    }

                    debug(
                        `${connection.name}: conectando...`,
                        url
                    );

                    try {
                        connection.socket =
                            new WebSocket(
                                url
                            );
                    }
                    catch (err) {
                        error(
                            `${connection.name}: falha ao criar WebSocket.`,
                            err
                        );

                        scheduleReconnect();

                        return;
                    }

                    // ----------------------------------------------------------
                    // OPEN
                    // ----------------------------------------------------------

                    connection.socket.onopen =
                        () => {

                            connection.attempts =
                                0;

                            const joinMessage = {
                                join:
                                    roomId,

                                out:
                                    out,

                                in:
                                    inChannel
                            };

                            debug(
                                `${connection.name}: enviando join.`,
                                joinMessage
                            );

                            connection.socket.send(
                                JSON.stringify(
                                    joinMessage
                                )
                            );

                            success(
                                `${connection.name}: WebSocket conectado.`
                            );
                        };

                    // ----------------------------------------------------------
                    // MESSAGE
                    // ----------------------------------------------------------

                    connection.socket.onmessage =
                        event => {

                            if (
                                !event?.data
                            ) {
                                return;
                            }

                            let parsed;

                            try {
                                parsed =
                                    JSON.parse(
                                        event.data
                                    );
                            }
                            catch (err) {
                                error(
                                    `${connection.name}: JSON inválido recebido.`,
                                    {
                                        raw:
                                            event.data,

                                        error:
                                            err
                                    }
                                );

                                return;
                            }

                            debug(
                                `${connection.name}: mensagem recebida.`,
                                parsed
                            );

                            processIncomingData(
                                parsed
                            );

                            /*
                             * Mantém callbacks do SSN.
                             */
                            if (
                                parsed?.get
                            ) {
                                try {
                                    connection.socket.send(
                                        JSON.stringify(
                                            {
                                                callback: {
                                                    get:
                                                        parsed.get,

                                                    result:
                                                        true
                                                }
                                            }
                                        )
                                    );
                                }
                                catch (err) {
                                    error(
                                        `${connection.name}: falha ao enviar callback.`,
                                        err
                                    );
                                }
                            }
                        };

                    // ----------------------------------------------------------
                    // ERROR
                    // ----------------------------------------------------------

                    connection.socket.onerror =
                        event => {
                            error(
                                `${connection.name}: erro WebSocket.`,
                                event
                            );
                        };

                    // ----------------------------------------------------------
                    // CLOSE
                    // ----------------------------------------------------------

                    connection.socket.onclose =
                        event => {

                            warn(
                                `${connection.name}: WebSocket fechado.`,
                                {
                                    code:
                                        event.code,

                                    reason:
                                        event.reason ||
                                        '(sem motivo)'
                                }
                            );

                            scheduleReconnect();
                        };
                }

                connect();
            }

            // ================================================================
            // SERVER MODES
            // ================================================================

            function connectServerModes() {
                if (
                    !CONFIG.session
                ) {
                    warn(
                        'Nenhuma session definida. WebSocket não será conectado.'
                    );

                    return;
                }

                const roomId =
                    CONFIG.session
                        .split(',')[0]
                        .trim();

                if (!roomId) {
                    error(
                        'Session inválida.'
                    );

                    return;
                }

                // ------------------------------------------------------------
                // SERVER / API
                // ------------------------------------------------------------

                if (
                    params.has('server')
                ) {
                    const customServer =
                        params.get(
                            'server'
                        );

                    /*
                     * Endpoint original do Social Stream Ninja.
                     *
                     * IMPORTANTE:
                     *
                     * /api é necessário para o server principal.
                     */
                    const url =
                        customServer ||
                        (
                            params.has(
                                'localserver'
                            )
                                ? 'ws://127.0.0.1:3000'
                                : 'wss://io.socialstream.ninja/api'
                        );

                    connectSocket(
                        {
                            name:
                                'server',

                            url,

                            roomId,

                            /*
                             * Canal do API/Dock server.
                             */
                            out:
                                2,

                            inChannel:
                                1
                        }
                    );
                }

                // ------------------------------------------------------------
                // SERVER2 / SERVER3 / EXTENSION
                // ------------------------------------------------------------

                if (
                    params.has('server2') ||
                    params.has('server3')
                ) {
                    const parameter =
                        params.has('server2')
                            ? 'server2'
                            : 'server3';

                    const customServer =
                        params.get(
                            parameter
                        );

                    const url =
                        customServer ||
                        'wss://io.socialstream.ninja/extension';

                    connectSocket(
                        {
                            name:
                                parameter,

                            url,

                            roomId,

                            /*
                             * Canal da extensão.
                             */
                            out:
                                3,

                            inChannel:
                                4
                        }
                    );
                }
            }

            // ================================================================
            // POSTMESSAGE / IFRAME LISTENER
            // ================================================================

            window.addEventListener(
                'message',
                event => {

                    /*
                     * Quando temos um iframe próprio,
                     * aceitamos somente mensagens originadas
                     * por ele.
                     */
                    if (
                        iframe &&
                        event.source !==
                        iframe.contentWindow
                    ) {
                        return;
                    }

                    const data =
                        event?.data;

                    if (!data) {
                        return;
                    }

                    /*
                     * Log de mensagens de debug.
                     *
                     * Isso é especialmente útil para descobrir
                     * novos formatos enviados pelo VDO.Ninja.
                     */
                    debug(
                        'Mensagem postMessage recebida:',
                        event.origin,
                        data
                    );

                    /*
                     * O bridge do SSN normalmente entrega:
                     *
                     * dataReceived.overlayNinja
                     */
                    if (
                        data.dataReceived?.overlayNinja
                    ) {
                        processIncomingData(
                            data
                        );

                        return;
                    }

                    /*
                     * Também aceitamos diretamente:
                     *
                     * overlayNinja
                     */
                    if (
                        data.overlayNinja
                    ) {
                        processIncomingData(
                            data
                        );

                        return;
                    }

                    /*
                     * Mensagens internas do VDO.Ninja:
                     *
                     * joining-room
                     * hssConnection
                     * view-stats-updated
                     * etc.
                     *
                     * São ignoradas pelo contador.
                     */
                }
            );

            // ================================================================
            // CLEANUP
            // ================================================================

            window.addEventListener(
                'beforeunload',
                () => {

                    log(
                        'Encerrando conexões...'
                    );

                    sockets.forEach(
                        connection => {

                            connection.closed =
                                true;

                            clearTimeout(
                                connection.timer
                            );

                            if (
                                connection.socket
                            ) {
                                try {
                                    connection.socket.onclose =
                                        null;

                                    connection.socket.close();
                                }
                                catch {
                                    // Ignora erros durante unload.
                                }
                            }
                        }
                    );
                }
            );

            // ================================================================
            // DEBUG INFORMATION
            // ================================================================

            function logConfiguration() {
                console.groupCollapsed(
                    `${LOG_PREFIX} configuração`
                );

                console.log(
                    'URL:',
                    window.location.href
                );

                console.log(
                    'Session:',
                    CONFIG.session ||
                    '(não definida)'
                );

                console.log(
                    'Password:',
                    CONFIG.password === 'false'
                        ? '(default)'
                        : '(definida)'
                );

                console.log(
                    'LAN only:',
                    CONFIG.lanOnly
                );

                console.log(
                    'Hide total:',
                    CONFIG.hideTotal
                );

                console.log(
                    'Server mode:',
                    CONFIG.hasServerMode
                );

                console.log(
                    'Debug:',
                    CONFIG.debug
                );

                console.log(
                    'Initial platforms:',
                    [...configuredPlatforms]
                );

                console.groupEnd();
            }

            // ================================================================
            // INITIALIZATION
            // ================================================================

            function initialize() {
                console.group(
                    `${LOG_PREFIX} inicialização`
                );

                log(
                    'Inicializando overlay de viewers...'
                );

                logConfiguration();

                // ------------------------------------------------------------
                // Initial platforms
                // ------------------------------------------------------------

                registerInitialPlatforms();

                // ------------------------------------------------------------
                // Initial state
                // ------------------------------------------------------------

                registeredPlatforms.forEach(
                    platform => {
                        viewerCounts[
                            platform
                        ] = 0;
                    }
                );

                syncViewerEntries();

                // ------------------------------------------------------------
                // Transport
                // ------------------------------------------------------------

                if (
                    CONFIG.hasServerMode
                ) {
                    connectServerModes();
                }
                else {
                    connectIframe();
                }

                success(
                    'Overlay inicializado.',
                    {
                        session:
                            CONFIG.session,

                        platforms:
                            [...registeredPlatforms],

                        transport:
                            CONFIG.hasServerMode
                                ? 'websocket'
                                : 'iframe'
                    }
                );

                console.groupEnd();
            }

            // ================================================================
            // START
            // ================================================================

            initialize();

        })();

    </script>
</body>

</html>
