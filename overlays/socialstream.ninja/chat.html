<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Overlay - Social Stream Ninja</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        type="text/css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        type="text/css"
    >

    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <style type="text/css">

        @charset 'UTF-8';

        /* ==========================================
           RESET
        ========================================== */

        *,
        *:after,
        *:before {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        * {
            outline: 0;
            border: none;
            font-family: inherit;
            font-size: 100%;
            background: transparent;
            vertical-align: baseline;
        }

        /* ==========================================
           VARIABLES
        ========================================== */

        :root {
            --background-color: #f9fafb;

            --badge-size: 28px;
            --emote-size: 42px;

            --message-background-color: #cbd5e1;
            --message-letter-spacing: 1px;
            --message-font-family: 'Noto Sans';
            --message-font-weight: 600;
            --message-font-size: 22px;
            --message-text-color: #030712;

            --content-image-max-height: 240px;
        }

        /* ==========================================
           BODY
        ========================================== */

        body {
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        /* ==========================================
           MAIN CONTAINER
        ========================================== */

        .main-container {
            max-width: 100vw;
            height: 100vh;

            display: flex;
            flex-wrap: nowrap;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;

            gap: 1rem;
            padding: 0 1rem 1rem;

            position: relative;

            -webkit-mask-image:
                linear-gradient(
                    0deg,
                    transparent 0%,
                    white 2%,
                    white 80%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    0deg,
                    transparent 0%,
                    white 2%,
                    white 80%,
                    transparent 100%
                );

            user-select: none;
        }

        .main-container.reverse {
            flex-direction: column-reverse;
        }

        /* ==========================================
           CHAT
        ========================================== */

        .chat {
            --header-height: calc(var(--message-font-size) * 2);

            --message-background-color: #f9fafb;
            --message-text-color: #030712;

            flex: 0 0 auto;

            max-height: 0;

            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            align-items: flex-start;

            overflow: hidden;

            font-family: var(--message-font-family);

            animation-name: fadeInUp, fadeOutUp;
            animation-duration: 240ms;
            animation-timing-function: linear, ease-out;
            animation-fill-mode: backwards, forwards;

            transition: max-height 500ms;
        }

        .chat.dark {
            --message-background-color: #0e0e10;
            --message-text-color: #f9fafb;
        }

        /* ==========================================
           CHAT HEADER
        ========================================== */

        .chat-header {
            z-index: 2;

            flex: 1 0;

            height: var(--header-height);
            line-height: var(--header-height);

            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        /* ==========================================
           BADGES
        ========================================== */

        .chat-user-badges {
            flex: 0 1;

            height: calc(var(--badge-size) * 2);

            display: flex;
            flex-wrap: nowrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;

            gap: 15px;

            line-height: calc(var(--badge-size) * 2);

            background-color: transparent;

            transform: scale(.9);
        }

        .chat-user-badges:not(:empty) {
            padding: 0 15px;
        }

        .chat-user-badges > img {
            object-fit: cover;
        }

        .chat-user-badges > img,
        .chat-user-badges > .source {
            min-width: var(--badge-size);
            min-height: var(--badge-size);
            max-height: var(--badge-size);

            display: block;
        }

        .chat-user-badges > .source {
            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: var(--badge-size);

            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-size: var(--badge-size);
        }

        .chat-user-badges > .source.twitch {
            background-color: #6441a5;

            mask-image: url('https://i.imgur.com/DnG97p5.png');
            -webkit-mask-image: url('https://i.imgur.com/DnG97p5.png');
        }

        .chat-user-badges > .source.facebook {
            background-color: #005FED;

            mask-image: url('https://i.imgur.com/t8pQUvH.png');
            -webkit-mask-image: url('https://i.imgur.com/t8pQUvH.png');
        }

        .chat-user-badges > .source.youtube,
        .chat-user-badges > .source.youtubeshorts {
            background-color: #f80231;

            mask-image: url('https://i.imgur.com/PCyzV61.png');
            -webkit-mask-image: url('https://i.imgur.com/PCyzV61.png');
        }

        .chat-user-badges > .source.kick {
            background-color: #00e701;

            mask-image: url('https://i.imgur.com/GONwTVy.png');
            -webkit-mask-image: url('https://i.imgur.com/GONwTVy.png');
        }

        .chat-user-badges > .source.tiktok {
            background-color: #2af0ea;

            mask-image: url('https://i.imgur.com/paZ8nLv.png');
            -webkit-mask-image: url('https://i.imgur.com/paZ8nLv.png');
        }

        /* ==========================================
           USERNAME
        ========================================== */

        .chat-user-name {
            --color: #030712;

            flex: 1 0;

            height: var(--header-height);

            display: block;

            white-space: nowrap;
            overflow: hidden;

            border-radius: 5px;

            padding: 0 20px;

            background-color: var(--color);

            letter-spacing:
                calc(var(--message-letter-spacing) * 2);

            font-weight: 700;
            font-size:
                calc(var(--message-font-size) * 1.1);

            transition: background-color 240ms;
        }

        .chat-user-name:not(.dark-text) {
            color: #0e0e10;
        }

        .chat-user-name.dark-text {
            color: #f9fafb;
        }

        /* ==========================================
           USERNAME COLORS
        ========================================== */

        .chat:nth-of-type(3n + 1)
        .chat-user-name:not(.own) {
            background-color: #2c4b7d !important;
        }

        .chat:nth-of-type(3n + 2)
        .chat-user-name:not(.own) {
            background-color: #e2612f !important;
        }

        .chat:nth-of-type(3n + 3)
        .chat-user-name:not(.own) {
            background-color: #b42f41 !important;
        }

        /* ==========================================
           MESSAGE
        ========================================== */

        .chat-message {
            z-index: 1;

            display: flex;

            padding: 15px 20px;

            border: 2px solid #64748b;
            border-radius: 0 10px 10px;

            margin-left: 1rem;

            background-color:
                var(--message-background-color);

            color:
                var(--message-text-color);
        }

        .chat-message-content {
            flex: 0 0 100%;

            display: flex;
            flex-wrap: wrap;
            flex-direction: row;

            justify-content: flex-start;
            align-items: center;

            overflow: hidden;
            overflow-wrap: break-word;

            line-height:
                calc(var(--message-font-size) * 1.33);

            letter-spacing:
                var(--message-letter-spacing);

            font-weight:
                var(--message-font-weight);

            font-size:
                var(--message-font-size);

            color:
                var(--message-text-color);
        }

        /* ==========================================
           TEXT ELEMENTS
        ========================================== */

        .chat-message-content .emote,
        .chat-message-content .mention,
        .chat-message-content .link {
            display: inline-block;
            margin: 0 5px;
        }

        .chat-message-content .mention,
        .chat-message-content .link {
            --color-rgb: 85, 136, 255;

            letter-spacing: 1px;
            color: rgb(var(--color-rgb));
        }

        .chat-message-content .mention {
            padding: 0 10px;

            border-radius: 5px;

            font-weight: 700;

            background-color:
                rgba(var(--color-rgb), .1);
        }

        .chat:not(.dark)
        .chat-message-content .mention {
            background-color:
                rgba(var(--color-rgb), .4);
        }

        /* ==========================================
           EMOTES
        ========================================== */

        .chat-message-content img:not(.content-image),
        .chat-message-content .emote,
        .chat-message-content .emote > * {
            width: var(--emote-size);
            height: auto;
        }

        .chat-message-content img:not(.content-image),
        .chat-message-content .emote {
            background-size: cover;
            background-repeat: no-repeat;
        }

        .chat-message-content img:not(.content-image),
        .chat-message-content .emote > * {
            -o-object-fit: cover;
            object-fit: cover;
        }

        .chat-message-content .link {
            font-weight: 300;
        }

        /* ==========================================
           CONTENT IMAGE / GIF
        ========================================== */

        .content-media {
            flex: 0 0 100%;

            display: flex;
            justify-content: flex-start;
            align-items: center;

            margin-top: 8px;
        }

        .content-image {
            width: auto;
            max-width: 100%;
            max-height: var(--content-image-max-height);
            height: auto;

            display: block;

            object-fit: contain;

            border-radius: 8px;
        }

    </style>
</head>

<body>

    <main class="main-container"></main>

    <!-- ==========================================
         MESSAGE TEMPLATE
    ========================================== -->

    <template id="message-template">

        <article class="chat">

            <header class="chat-header">

                <span class="chat-user-name"></span>

                <aside class="chat-user-badges badges"></aside>

            </header>

            <div class="chat-message">

                <div class="chat-message-content"></div>

            </div>

        </article>

    </template>

    <!-- ==========================================
         LINK TEMPLATE
    ========================================== -->

    <template id="link-template">

        <span class="link"></span>

    </template>

    <!-- ==========================================
         MENTION TEMPLATE
    ========================================== -->

    <template id="mention-template">

        <span class="mention"></span>

    </template>


    <script type="text/javascript" defer>

        (() => {

            'use strict';


            // ==========================================
            // URL PARAMS / CONFIG
            // ==========================================

            const urlParams =
                new URLSearchParams(
                    window.location.search.toLowerCase()
                );


            const CONFIG = {

                roomID:
                    urlParams.get('session') ||
                    'iWWnKL28tQ',

                password:
                    'false',

                featuredMode:
                    false,

                reversed:
                    urlParams.has('reverse'),

                darkMode:
                    urlParams.has('darkmode'),

                hideCommands:
                    urlParams.has('hidecommands'),

                useUserColor:
                    urlParams.has('usercolor'),

                messageDuration:
                    Number(
                        urlParams.get('messageduration')
                    ) || 30000,

                maxBadges:
                    Number(
                        urlParams.get('limitbadges')
                    ) || Infinity,

                maxMessages:
                    Number(
                        urlParams.get('limit')
                    ) || Infinity,

                serverURL:
                    urlParams.get('server') ||
                    urlParams.get('server2') ||
                    (
                        urlParams.has('localserver')
                            ? 'ws://127.0.0.1:3000'
                            : 'wss://io.socialstream.ninja'
                    ),

                useSocket:
                    urlParams.has('server') ||
                    urlParams.has('server2')
            };


            // ==========================================
            // DOM
            // ==========================================

            const DOM = {

                container:
                    document.querySelector(
                        '.main-container'
                    ),

                templates: {

                    message:
                        document.getElementById(
                            'message-template'
                        ),

                    link:
                        document.getElementById(
                            'link-template'
                        ),

                    mention:
                        document.getElementById(
                            'mention-template'
                        )
                }
            };


            // ==========================================
            // STATE
            // ==========================================

            const state = {

                socket:
                    null,

                reconnectAttempts:
                    0,

                messageTimers:
                    new Map()
            };


            // ==========================================
            // INIT
            // ==========================================

            if (CONFIG.reversed) {

                DOM.container.classList.add(
                    'reverse'
                );
            }


            // ==========================================
            // GENERIC HELPERS
            // ==========================================

            const isObject =
                value =>
                    value !== null &&
                    typeof value === 'object';


            const safeText =
                value =>
                    value?.toString?.() || '';


            const nextFrame =
                () =>
                    new Promise(resolve =>
                        requestAnimationFrame(resolve)
                    );


            const createElement =
                (
                    tag,
                    className = ''
                ) => {

                    const element =
                        document.createElement(tag);

                    if (className) {
                        element.className =
                            className;
                    }

                    return element;
                };


            // ==========================================
            // COLOR HELPERS
            // ==========================================

            function normalizeColor(color) {

                if (!color) {
                    return '';
                }

                let normalized =
                    safeText(color).trim();


                // #RGB / RGB
                if (
                    /^[A-Fa-f0-9]{3}$/.test(
                        normalized
                    )
                ) {

                    normalized =
                        `#${normalized}`;
                }


                // #RRGGBB / RRGGBB
                if (
                    /^[A-Fa-f0-9]{6}$/.test(
                        normalized
                    )
                ) {

                    normalized =
                        `#${normalized}`;
                }


                const temp =
                    document.createElement('div');

                temp.style.color =
                    normalized;

                document.body.appendChild(temp);


                const computed =
                    getComputedStyle(temp).color;


                temp.remove();


                return computed;
            }


            function isDarkColor(color) {

                const normalized =
                    normalizeColor(color);

                const rgbMatch =
                    normalized.match(
                        /^rgba?\((\d+),\s*(\d+),\s*(\d+)/i
                    );


                if (!rgbMatch) {
                    return false;
                }


                const red =
                    Number(rgbMatch[1]);

                const green =
                    Number(rgbMatch[2]);

                const blue =
                    Number(rgbMatch[3]);


                const brightness =
                    (
                        red * 299 +
                        green * 587 +
                        blue * 114
                    ) / 1000;


                return brightness < 122;
            }


            // ==========================================
            // HEIGHT / LAYOUT
            // ==========================================

            function getTrueHeight(element) {

                if (!element) {
                    return 0;
                }


                const style =
                    getComputedStyle(element);


                const parentStyle =
                    element.parentElement
                        ? getComputedStyle(
                            element.parentElement
                        )
                        : null;


                let childrenHeight = 0;


                for (
                    const child
                    of element.children
                ) {

                    childrenHeight +=
                        child.offsetHeight;
                }


                return (
                    childrenHeight +
                    element.scrollHeight +
                    (parseFloat(style.gap) || 0) +
                    (parseFloat(parentStyle?.gap) || 0)
                );
            }


            async function waitForImageLoad(image) {

                if (
                    !image ||
                    image.complete
                ) {
                    return;
                }


                await new Promise(resolve => {

                    const finish =
                        () => resolve();


                    image.addEventListener(
                        'load',
                        finish,
                        { once: true }
                    );

                    image.addEventListener(
                        'error',
                        finish,
                        { once: true }
                    );

                });
            }


            // ==========================================
            // MESSAGE FORMATTERS
            // ==========================================

            function createTemplateHTML(
                template,
                selector,
                text
            ) {

                const fragment =
                    template?.content?.cloneNode(true);


                const element =
                    fragment?.querySelector(
                        selector
                    );


                if (!element) {
                    return text;
                }


                element.textContent =
                    text;


                return element.outerHTML;
            }


            function formatMessageText(text = '') {

                let formatted =
                    safeText(text);


                // URLs
                formatted =
                    formatted.replace(
                        /(?<![\(\"\'\=])(https?\:\/\/[^\s\<\>\"\'\)]+)/gi,

                        match =>
                            createTemplateHTML(
                                DOM.templates.link,
                                '.link',
                                match
                            )
                    );


                // Mentions
                formatted =
                    formatted.replace(
                        /\@([A-Za-z0-9\-\_]{4,})/gi,

                        match =>
                            createTemplateHTML(
                                DOM.templates.mention,
                                '.mention',
                                match
                            )
                    );


                return formatted;
            }


            // ==========================================
            // BADGES
            // ==========================================

            function createBadge(src) {

                if (!src) {
                    return null;
                }


                const image =
                    new Image();


                const element =
                    createElement(
                        'img',
                        'badge'
                    );


                image.onload =
                    ({ target }) => {

                        element.src =
                            target.src;
                    };


                image.src =
                    src;


                return element;
            }


            function createSVGbadge(html) {

                if (!html) {
                    return null;
                }


                const wrapper =
                    createElement(
                        'span',
                        'badge'
                    );


                const svg =
                    document.createElement('svg');


                svg.innerHTML =
                    html;


                wrapper.appendChild(svg);


                return wrapper;
            }


            function createSource(platform) {

                if (!platform) {
                    return null;
                }


                return createElement(
                    'span',
                    `source ${platform}`
                );
            }


            // ==========================================
            // CONTENT IMAGE / GIF
            // ==========================================

            function createContentImage(
                src,
                alt = 'Chat image'
            ) {

                if (!src) {
                    return null;
                }


                const wrapper =
                    createElement(
                        'div',
                        'content-media'
                    );


                const image =
                    createElement(
                        'img',
                        'content-image'
                    );


                image.src =
                    src;

                image.alt =
                    alt;

                image.loading =
                    'eager';

                image.decoding =
                    'async';


                image.onerror =
                    () => {

                        wrapper.remove();
                    };


                wrapper.appendChild(
                    image
                );


                return {
                    wrapper,
                    image
                };
            }


            // ==========================================
            // MESSAGE REMOVE
            // ==========================================

            function removeMessage(
                messageElement
            ) {

                if (
                    !messageElement?.parentNode
                ) {
                    return;
                }


                const messageId =
                    messageElement.id;


                const timeout =
                    state.messageTimers.get(
                        messageId
                    );


                if (timeout) {

                    clearTimeout(
                        timeout
                    );

                    state.messageTimers.delete(
                        messageId
                    );
                }


                messageElement.remove();
            }


            // ==========================================
            // MESSAGE VALIDATION
            // ==========================================

            function isValidMessage(data) {

                if (!data) {
                    return false;
                }


                const hasText =
                    Boolean(
                        data.chatmessage
                    );


                const hasImage =
                    Boolean(
                        data.contentimg
                    );


                const hasContent =
                    hasText ||
                    hasImage;


                if (
                    !data.chatname ||
                    !hasContent
                ) {
                    return false;
                }


                if (
                    data.hasDonation ||
                    data.donation
                ) {
                    return false;
                }


                if (
                    CONFIG.hideCommands &&
                    hasText &&
                    data.chatmessage.startsWith('!')
                ) {
                    return false;
                }


                return true;
            }


            // ==========================================
            // MESSAGE ELEMENT CREATION
            // ==========================================

            function createMessageElement(
                data
            ) {

                const fragment =
                    DOM.templates.message
                        .content
                        .cloneNode(true);


                const messageElement =
                    fragment.querySelector(
                        '.chat'
                    );


                const usernameElement =
                    fragment.querySelector(
                        '.chat-user-name'
                    );


                const badgesContainer =
                    fragment.querySelector(
                        '.chat-user-badges'
                    );


                const messageContent =
                    fragment.querySelector(
                        '.chat-message-content'
                    );


                return {
                    messageElement,
                    usernameElement,
                    badgesContainer,
                    messageContent
                };
            }


            // ==========================================
            // USER COLOR
            // ==========================================

            function getUserColor(data) {

                return (
                    data.nameColor ||
                    data.chatnameColor ||
                    data.textColor ||
                    data.color ||
                    '#030712'
                );
            }


            function applyUserColor(
                element,
                color
            ) {

                if (!element || !color) {
                    return;
                }


                const normalizedColor =
                    normalizeColor(color);


                if (!normalizedColor) {
                    return;
                }


                element.style.setProperty(
                    '--color',
                    normalizedColor,
                    'important'
                );


                element.classList.toggle(
                    'dark-text',
                    isDarkColor(
                        normalizedColor
                    )
                );
            }


            // ==========================================
            // SOURCE
            // ==========================================

            function renderSource(
                container,
                platform
            ) {

                if (!platform) {
                    return;
                }


                const source =
                    createSource(platform);


                if (source) {

                    container.appendChild(
                        source
                    );
                }
            }


            // ==========================================
            // BADGES
            // ==========================================

            function renderBadges(
                container,
                badges
            ) {

                if (!Array.isArray(badges)) {
                    return;
                }


                for (
                    const badge
                    of badges.slice(
                        0,
                        CONFIG.maxBadges
                    )
                ) {

                    let badgeElement =
                        null;


                    if (isObject(badge)) {

                        if (
                            badge.type === 'img' &&
                            badge.src
                        ) {

                            badgeElement =
                                createBadge(
                                    badge.src
                                );

                        } else if (
                            badge.type === 'svg' &&
                            badge.html
                        ) {

                            badgeElement =
                                createSVGbadge(
                                    badge.html
                                );
                        }

                    } else {

                        badgeElement =
                            createBadge(
                                badge
                            );
                    }


                    if (badgeElement) {

                        container.appendChild(
                            badgeElement
                        );
                    }
                }
            }


            // ==========================================
            // MESSAGE CONTENT
            // ==========================================

            function renderMessageContent(
                content,
                data
            ) {

                const {
                    chatmessage,
                    contentimg,
                    meta
                } = data;


                // ------------------------------------------
                // TEXT
                // ------------------------------------------

                if (chatmessage) {

                    content.innerHTML =
                        formatMessageText(
                            chatmessage
                        );
                }


                // ------------------------------------------
                // CONTENT IMAGE / GIF
                // ------------------------------------------

                if (contentimg) {

                    const image =
                        createContentImage(
                            contentimg,
                            meta?.gifLabel ||
                            'Chat image'
                        );


                    if (image) {

                        content.appendChild(
                            image.wrapper
                        );


                        return image.image;
                    }
                }


                return null;
            }


            // ==========================================
            // MESSAGE INSERTION
            // ==========================================

            function insertMessage(
                messageElement
            ) {

                if (CONFIG.reversed) {

                    const firstMessage =
                        DOM.container.querySelector(
                            '.chat'
                        );


                    if (firstMessage) {

                        DOM.container.insertBefore(
                            messageElement,
                            firstMessage
                        );

                    } else {

                        DOM.container.appendChild(
                            messageElement
                        );
                    }

                    return;
                }


                DOM.container.appendChild(
                    messageElement
                );
            }


            // ==========================================
            // MESSAGE LIMIT
            // ==========================================

            function enforceMessageLimit() {

                if (
                    !Number.isFinite(
                        CONFIG.maxMessages
                    )
                ) {
                    return;
                }


                const messages =
                    DOM.container.querySelectorAll(
                        '.chat'
                    );


                if (
                    messages.length <=
                    CONFIG.maxMessages
                ) {
                    return;
                }


                const oldestMessage =
                    CONFIG.reversed
                        ? messages[
                            messages.length - 1
                        ]
                        : messages[0];


                if (oldestMessage) {

                    removeMessage(
                        oldestMessage
                    );
                }
            }


            // ==========================================
            // AUTO REMOVE
            // ==========================================

            function scheduleMessageRemoval(
                messageElement,
                messageId
            ) {

                const timeout =
                    setTimeout(
                        () => {

                            removeMessage(
                                messageElement
                            );

                        },
                        CONFIG.messageDuration + 250
                    );


                state.messageTimers.set(
                    messageId,
                    timeout
                );
            }


            // ==========================================
            // MESSAGE CREATION
            // ==========================================

            async function addMessageToOverlay(
                data
            ) {

                if (
                    !isValidMessage(data)
                ) {
                    return;
                }


                const {
                    chatname,
                    type,
                    chatbadges,
                    mid
                } = data;


                // ------------------------------------------
                // CREATE DOM
                // ------------------------------------------

                const {
                    messageElement,
                    usernameElement,
                    badgesContainer,
                    messageContent
                } =
                    createMessageElement(
                        data
                    );


                // ------------------------------------------
                // MESSAGE ID
                // ------------------------------------------

                const messageId =
                    mid ||
                    `msg-${Date.now()}-${Math.random()
                        .toString(36)
                        .slice(2, 8)}`;


                messageElement.id =
                    messageId;


                // ------------------------------------------
                // DATA ATTRIBUTES
                // ------------------------------------------

                messageElement.dataset.platform =
                    type || '';


                messageElement.dataset.from =
                    chatname;


                // ------------------------------------------
                // THEME
                // ------------------------------------------

                messageElement.classList.toggle(
                    'dark',
                    CONFIG.darkMode
                );


                // ------------------------------------------
                // USERNAME
                // ------------------------------------------

                usernameElement.textContent =
                    chatname;


                usernameElement.classList.toggle(
                    'own',
                    CONFIG.useUserColor
                );


                if (CONFIG.useUserColor) {

                    applyUserColor(
                        usernameElement,
                        getUserColor(data)
                    );
                }


                // ------------------------------------------
                // SOURCE
                // ------------------------------------------

                renderSource(
                    badgesContainer,
                    type
                );


                // ------------------------------------------
                // BADGES
                // ------------------------------------------

                renderBadges(
                    badgesContainer,
                    chatbadges
                );


                // ------------------------------------------
                // CONTENT
                // ------------------------------------------

                const contentImage =
                    renderMessageContent(
                        messageContent,
                        data
                    );


                // ------------------------------------------
                // INSERT
                // ------------------------------------------

                insertMessage(
                    messageElement
                );


                // ------------------------------------------
                // FORCE REFLOW
                // ------------------------------------------

                void messageElement.offsetWidth;


                // ------------------------------------------
                // WAIT FOR IMAGE
                // ------------------------------------------

                if (contentImage) {

                    await waitForImageLoad(
                        contentImage
                    );
                }


                // ------------------------------------------
                // SCROLL
                // ------------------------------------------

                DOM.container.scrollTo({

                    top:
                        DOM.container.scrollHeight,

                    behavior:
                        'smooth'
                });


                // ------------------------------------------
                // NEXT FRAME
                // ------------------------------------------

                await nextFrame();


                // ------------------------------------------
                // EXPAND MESSAGE
                // ------------------------------------------

                messageElement.style.setProperty(
                    'max-height',
                    `${getTrueHeight(messageElement)}px`,
                    'important'
                );


                // ------------------------------------------
                // ANIMATION
                // ------------------------------------------

                messageElement.style.setProperty(
                    'animation-delay',
                    `0s, ${CONFIG.messageDuration}ms`
                );


                // ------------------------------------------
                // AUTO REMOVE
                // ------------------------------------------

                scheduleMessageRemoval(
                    messageElement,
                    messageId
                );


                // ------------------------------------------
                // MESSAGE LIMIT
                // ------------------------------------------

                enforceMessageLimit();
            }


            // ==========================================
            // IFRAME BRIDGE
            // ==========================================

            function createBridgeIframe() {

                const iframe =
                    document.createElement(
                        'iframe'
                    );


                iframe.src =
                    CONFIG.featuredMode

                        ? `https://vdo.socialstream.ninja/?ln&password=${CONFIG.password}&salt=vdo.ninja&label=overlay&exclude=${CONFIG.roomID}&scene&novideo&noaudio&cleanoutput&room=${CONFIG.roomID}`

                        : `https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=${CONFIG.password}&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=${CONFIG.roomID}`;


                iframe.allow =
                    'midi;geolocation;microphone;';


                iframe.style.cssText = `
                    width: 0;
                    height: 0;
                    position: fixed;
                    left: -100px;
                    top: -100px;
                    border: 0;
                    pointer-events: none;
                `;


                document.body.appendChild(
                    iframe
                );


                window.addEventListener(
                    'message',
                    ({ source, data }) => {

                        // ------------------------------------------
                        // SECURITY / SOURCE CHECK
                        // ------------------------------------------

                        if (
                            source !==
                            iframe.contentWindow
                        ) {
                            return;
                        }


                        // ------------------------------------------
                        // SSN DATA
                        // ------------------------------------------

                        const overlayData =
                            data?.dataReceived
                                ?.overlayNinja;


                        if (!overlayData) {
                            return;
                        }


                        addMessageToOverlay(
                            overlayData
                        );
                    }
                );


                return iframe;
            }


            // ==========================================
            // WEBSOCKET
            // ==========================================

            function connectSocket() {

                if (!CONFIG.useSocket) {
                    return;
                }


                // ------------------------------------------
                // CLOSE PREVIOUS SOCKET
                // ------------------------------------------

                if (state.socket) {

                    state.socket.close();
                }


                // ------------------------------------------
                // CREATE SOCKET
                // ------------------------------------------

                state.socket =
                    new WebSocket(
                        CONFIG.serverURL
                    );


                // ------------------------------------------
                // OPEN
                // ------------------------------------------

                state.socket.onopen =
                    () => {

                        state.reconnectAttempts =
                            0;


                        state.socket.send(
                            JSON.stringify({

                                join:
                                    CONFIG.roomID,

                                out:
                                    3,

                                in:
                                    4
                            })
                        );
                    };


                // ------------------------------------------
                // MESSAGE
                // ------------------------------------------

                state.socket.onmessage =
                    ({ data }) => {

                        if (!data) {
                            return;
                        }


                        try {

                            const parsed =
                                JSON.parse(
                                    data
                                );


                            if (parsed) {

                                addMessageToOverlay(
                                    parsed
                                );
                            }

                        } catch (error) {

                            console.error(
                                '[WebSocket] Parse error:',
                                error,
                                data
                            );
                        }
                    };


                // ------------------------------------------
                // ERROR
                // ------------------------------------------

                state.socket.onerror =
                    error => {

                        console.error(
                            '[WebSocket] Error:',
                            error
                        );
                    };


                // ------------------------------------------
                // CLOSE / RECONNECT
                // ------------------------------------------

                state.socket.onclose =
                    () => {

                        state.reconnectAttempts++;


                        const reconnectDelay =
                            Math.min(
                                100 *
                                state.reconnectAttempts,
                                5000
                            );


                        setTimeout(
                            connectSocket,
                            reconnectDelay
                        );
                    };
            }


            // ==========================================
            // VISIBILITY RECOVERY
            // ==========================================

            document.addEventListener(
                'visibilitychange',
                () => {

                    if (
                        document.visibilityState !==
                        'visible'
                    ) {
                        return;
                    }


                    if (
                        !CONFIG.useSocket
                    ) {
                        return;
                    }


                    if (
                        state.socket &&
                        state.socket.readyState ===
                        WebSocket.OPEN
                    ) {
                        return;
                    }


                    connectSocket();
                }
            );


            // ==========================================
            // INIT
            // ==========================================

            createBridgeIframe();

            connectSocket();

        })();

    </script>

</body>
